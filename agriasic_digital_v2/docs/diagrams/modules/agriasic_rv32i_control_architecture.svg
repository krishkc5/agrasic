<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">AgriASIC Digital Design - RV32IM Control Architecture</title>
  <desc id="desc">Rev 4.3 architecture. A free-running digital excitation generator drives the electrodes differentially and exports a phase index to the measurement FSM, which strobes samples at four phase points, runs eight SAR bit trials per sample through sar_controller, and accumulates I and Q separately. An RV32IM core handles sweep policy and is clock-disabled during measurement.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 z" fill="#CBD5E1"/>
    </marker>
    <marker id="arrowKey" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 z" fill="#C4B5FD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="840" fill="#121212"/>

  <text x="40" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Rev 4.3 - phase-locked measurement engine</text>
  <text x="40" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#9CA3AF">Excitation runs free; the sampler locks to its phase. Bit trials live in digital.</text>

  <rect x="310" y="96" width="1080" height="560" rx="26" fill="#1C1C1C" stroke="#5B5B5B" stroke-dasharray="10 8"/>
  <text x="332" y="130" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">ASIC die</text>

  <rect x="40" y="240" width="210" height="130" rx="16" fill="#5A5A54" stroke="#93938A"/>
  <text x="82" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#F3F4F6">Electrodes</text>
  <text x="112" y="322" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#E5E7EB">soil</text>

  <rect x="340" y="150" width="272" height="100" rx="18" fill="#5440A6" stroke="#A78BFA"/>
  <text x="360" y="186" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#EDE9FE">Excitation gen</text>
  <text x="360" y="212" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">free-running, 16-state phase</text>
  <text x="360" y="234" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">f_exc = f_clk / (16*N), N 14-bit</text>

  <rect x="340" y="278" width="272" height="94" rx="18" fill="#8C3A18" stroke="#D97706"/>
  <text x="360" y="314" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FEEAD9">Wideband TIA</text>
  <text x="360" y="340" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#FDE68A">10 MHz closed loop</text>
  <text x="360" y="360" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#FDE68A">current to voltage</text>

  <rect x="340" y="400" width="272" height="100" rx="18" fill="#8C3A18" stroke="#D97706"/>
  <text x="360" y="436" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FEEAD9">8-bit SAR ADC</text>
  <text x="360" y="462" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#FDE68A">CDAC + comparator only</text>
  <text x="360" y="484" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#FDE68A">no internal SAR logic</text>

  <rect x="340" y="528" width="272" height="80" rx="18" fill="#8C3A18" stroke="#D97706"/>
  <text x="360" y="562" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FEEAD9">Temp sense (PTAT)</text>
  <text x="360" y="586" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#FDE68A">via ADC test mux</text>

  <rect x="672" y="150" width="272" height="222" rx="18" fill="#5440A6" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="692" y="186" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#EDE9FE">Measurement FSM</text>
  <text x="692" y="212" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">14 states, phase-index compare</text>
  <text x="692" y="234" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">strobes at 0 / 90 / 180 / 270 deg</text>
  <text x="692" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#EDE9FE">I/Q accumulators</text>
  <text x="692" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">two signed 16-bit, raw diffs</text>
  <text x="692" y="312" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">shadow snapshot on done</text>
  <text x="692" y="344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#C4B5FD">owns all real-time timing</text>

  <rect x="672" y="400" width="272" height="100" rx="18" fill="#5440A6" stroke="#A78BFA"/>
  <text x="692" y="436" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#EDE9FE">SAR controller</text>
  <text x="692" y="462" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">8 bit trials, MSB first</text>
  <text x="692" y="484" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">per-trial regeneration wait</text>

  <rect x="1004" y="164" width="272" height="120" rx="18" fill="#5440A6" stroke="#A78BFA"/>
  <text x="1024" y="200" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#EDE9FE">RV32IM core + ROM</text>
  <text x="1024" y="226" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">sweep policy only</text>
  <text x="1024" y="248" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">MMIO @ 0x8000_0000</text>
  <text x="1024" y="270" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#C4B5FD">clock-disabled while measuring</text>

  <rect x="1004" y="376" width="272" height="124" rx="18" fill="#5440A6" stroke="#A78BFA"/>
  <text x="1024" y="412" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#EDE9FE">SPI slave + regfile</text>
  <text x="1024" y="438" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">10 registers, mode 0</text>
  <text x="1024" y="460" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#DDD6FE">indexed result readout</text>
  <text x="1024" y="484" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#FCA5A5">REG_PHASE_IDX unwired (GAP-10)</text>

  <rect x="470" y="690" width="640" height="96" rx="20" fill="#515151" stroke="#A3A3A3"/>
  <text x="566" y="730" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#F3F4F6">External refs, host, 160 MHz clock</text>
  <text x="524" y="758" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#D4D4D8">VREFH, VREFL, VCM, V_EXC, SPI host</text>

  <line x1="336" y1="192" x2="256" y2="264" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="188" y="212" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#D4D4D8">drive_p/n</text>
  <line x1="252" y1="330" x2="336" y2="322" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="254" y="368" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#D4D4D8">I_return</text>

  <line x1="476" y1="372" x2="476" y2="396" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="476" y1="528" x2="476" y2="504" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="612" y1="188" x2="668" y2="188" stroke="#C4B5FD" stroke-width="5" marker-end="url(#arrowKey)"/>
  <text x="600" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#C4B5FD">phase_index[3:0] + period_tick</text>

  <line x1="668" y1="428" x2="616" y2="428" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="606" y="418" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#D4D4D8" text-anchor="end">adc_dac</text>
  <line x1="616" y1="470" x2="668" y2="470" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="606" y="480" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#D4D4D8" text-anchor="end">adc_comp</text>

  <line x1="808" y1="372" x2="808" y2="396" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="818" y="390" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#D4D4D8">sample_req</text>

  <path d="M944,290 L974,290 L974,412 L1000,412" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="880" y="316" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#D4D4D8">result_i/q</text>

  <line x1="1140" y1="288" x2="1140" y2="372" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1150" y="336" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#D4D4D8">MMIO cfg / status</text>

  <line x1="790" y1="690" x2="790" y2="660" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="682" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#D4D4D8">160 MHz, VREF*</text>

  <path d="M1080,720 L1330,720 L1330,438 L1280,438" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1338" y="600" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#D4D4D8" transform="rotate(-90 1338 600)">SPI host</text>

  <rect x="40" y="440" width="240" height="168" rx="14" fill="#1C1C1C" stroke="#3F3F46"/>
  <text x="58" y="472" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Legend</text>
  <rect x="58" y="490" width="20" height="20" rx="5" fill="#8C3A18" stroke="#D97706"/>
  <text x="90" y="506" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#E5E7EB">analog on die</text>
  <rect x="58" y="522" width="20" height="20" rx="5" fill="#5440A6" stroke="#A78BFA"/>
  <text x="90" y="538" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#E5E7EB">digital on die</text>
  <rect x="58" y="554" width="20" height="20" rx="5" fill="#5A5A54" stroke="#93938A"/>
  <text x="90" y="570" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#E5E7EB">external</text>
  <line x1="58" y1="592" x2="82" y2="592" stroke="#C4B5FD" stroke-width="5"/>
  <text x="90" y="597" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#C4B5FD">phase-lock reference</text>
</svg>
