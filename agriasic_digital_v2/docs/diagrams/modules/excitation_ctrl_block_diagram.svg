<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="5000" height="3000" viewBox="0 0 5000 3000" role="img" aria-labelledby="t d">
  <title id="t">excitation_ctrl module block diagram</title>
  <desc id="d">Detailed block diagram for excitation_ctrl showing divider tick engine, phase latch, and settle counter behavior.</desc>
  <defs>
    <marker id="x1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1565C0"/></marker>
    <marker id="x2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#64B5F6" stroke-width="1.5"/></marker>
    <marker id="x3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7B1FA2"/></marker>
  </defs>
  <rect width="5000" height="3000" fill="#fff"/>
  <text x="120" y="95" font-family="Arial" font-size="38" font-weight="700" fill="#212121">Module: excitation_ctrl</text>
  <rect x="80" y="180" width="4840" height="2740" rx="12" fill="#F5F5F5" stroke="#444" stroke-width="2"/>

  <rect x="250" y="490" width="1040" height="500" rx="10" fill="#212121" stroke="#212121" stroke-width="2"/>
  <text x="310" y="575" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Inputs</text>
  <text x="310" y="620" font-family="Arial" font-size="20" fill="#fff">enable_i, set_phase_i, phase_value_i</text>
  <text x="310" y="655" font-family="Arial" font-size="20" fill="#fff">settle_cycles_i, divider_i</text>
  <text x="310" y="690" font-family="Arial" font-size="20" fill="#fff">clk, rst_n</text>

  <rect x="1500" y="450" width="3200" height="1800" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="2"/>
  <text x="1560" y="530" font-family="Arial" font-size="28" font-weight="700" fill="#212121">Internal blocks</text>

  <rect x="1650" y="670" width="860" height="320" rx="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="1710" y="760" font-family="Arial" font-size="30" font-weight="700" fill="#212121">Divider counter</text>
  <text x="1710" y="805" font-family="Arial" font-size="19" fill="#212121">div_cnt increments to divider_i</text>
  <text x="1710" y="840" font-family="Arial" font-size="19" fill="#212121">tick_o high on match or divider=0</text>

  <rect x="2760" y="670" width="860" height="320" rx="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="2820" y="760" font-family="Arial" font-size="30" font-weight="700" fill="#212121">Phase/settle loader</text>
  <text x="2820" y="805" font-family="Arial" font-size="19" fill="#212121">set_phase drives polarity_o</text>
  <text x="2820" y="840" font-family="Arial" font-size="19" fill="#212121">load settle_cnt from settle_cycles</text>

  <rect x="2190" y="1140" width="900" height="360" rx="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="2250" y="1230" font-family="Arial" font-size="30" font-weight="700" fill="#212121">Settle countdown</text>
  <text x="2250" y="1275" font-family="Arial" font-size="19" fill="#212121">if !settled and tick_o: settle_cnt--</text>
  <text x="2250" y="1310" font-family="Arial" font-size="19" fill="#212121">settled_o asserted when settle_cnt reaches 0</text>
  <text x="2250" y="1345" font-family="Arial" font-size="19" fill="#212121">enable_i=0 forces idle and settled</text>

  <rect x="3380" y="1140" width="1120" height="360" rx="10" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/>
  <text x="3440" y="1230" font-family="Arial" font-size="30" font-weight="700" fill="#212121">Outputs</text>
  <text x="3440" y="1275" font-family="Arial" font-size="19" fill="#212121">polarity_o to analog switch drive</text>
  <text x="3440" y="1310" font-family="Arial" font-size="19" fill="#212121">settled_o feedback to measurement FSM</text>
  <text x="3440" y="1345" font-family="Arial" font-size="19" fill="#212121">tick_o optional visibility/diagnostic</text>

  <path d="M1290,620 L1650,620 L1650,780" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="8 6" fill="none" marker-end="url(#x3)"/>
  <text x="1320" y="595" font-family="Arial" font-size="17" fill="#212121">divider_i</text>
  <path d="M1290,690 L2760,690" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="8 6" fill="none" marker-end="url(#x3)"/>
  <text x="1320" y="718" font-family="Arial" font-size="17" fill="#212121">set_phase_i, phase_value_i, settle_cycles_i</text>

  <path d="M2510,830 L2760,830" stroke="#64B5F6" stroke-width="1.5" fill="none" marker-end="url(#x2)"/>
  <text x="2560" y="805" font-family="Arial" font-size="17" fill="#212121">tick_o</text>
  <path d="M3190,990 L3190,1140" stroke="#64B5F6" stroke-width="1.5" fill="none" marker-end="url(#x2)"/>
  <text x="3220" y="1080" font-family="Arial" font-size="17" fill="#212121">settle_cnt init</text>

  <path d="M3090,1320 L3380,1320" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#x1)"/>
  <text x="3140" y="1298" font-family="Arial" font-size="17" fill="#212121">settled_o</text>
  <path d="M3620,980 L3620,1140" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#x1)"/>
  <text x="3650" y="1070" font-family="Arial" font-size="17" fill="#212121">polarity_o</text>

  <rect x="250" y="1690" width="4450" height="1120" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="2"/>
  <text x="310" y="1775" font-family="Arial" font-size="28" font-weight="700" fill="#212121">Behavior notes</text>
  <text x="310" y="1825" font-family="Arial" font-size="20" fill="#212121">- divider_i=0 produces a tick each cycle for fastest settling.</text>
  <text x="310" y="1865" font-family="Arial" font-size="20" fill="#212121">- set_phase_i atomically updates polarity and reloads settle counter.</text>
  <text x="310" y="1905" font-family="Arial" font-size="20" fill="#212121">- settled_o is the handshake that permits sampling in the FSM.</text>
  <text x="310" y="1945" font-family="Arial" font-size="20" fill="#212121">- when enable_i deasserts, block returns to known idle state.</text>

  <line x1="310" y1="2035" x2="490" y2="2035" stroke="#1565C0" stroke-width="2" marker-end="url(#x1)"/>
  <text x="530" y="2043" font-family="Arial" font-size="18" fill="#212121">WIRE.DATA/STATUS</text>
  <line x1="1500" y1="2035" x2="1680" y2="2035" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#x2)"/>
  <text x="1720" y="2043" font-family="Arial" font-size="18" fill="#212121">WIRE.CTRL</text>
  <line x1="2320" y1="2035" x2="2500" y2="2035" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="8 6" marker-end="url(#x3)"/>
  <text x="2540" y="2043" font-family="Arial" font-size="18" fill="#212121">WIRE.CFG</text>
</svg>
