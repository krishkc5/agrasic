<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">AgriASIC Digital Design - RV32I Control Architecture</title>
  <desc id="desc">Reference architecture for the on-die RV32I controller, fixed-gain TIA, 8-bit SAR ADC, excitation generation, and SPI status registers.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 z" fill="#CBD5E1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="#121212"/>

  <rect x="310" y="40" width="1080" height="620" rx="26" fill="#1C1C1C" stroke="#5B5B5B" stroke-dasharray="10 8"/>
  <text x="340" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F8FAFC">ASIC die</text>

  <rect x="40" y="160" width="210" height="110" rx="16" fill="#5A5A54" stroke="#93938A"/>
  <text x="82" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#F3F4F6">Electrodes</text>
  <text x="98" y="236" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#E5E7EB">soil</text>

  <rect x="360" y="110" width="300" height="90" rx="18" fill="#8C3A18" stroke="#D97706"/>
  <text x="440" y="148" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FEEAD9">Excitation gen</text>
  <text x="418" y="173" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#FDE68A">divider, drive switch</text>

  <rect x="360" y="240" width="300" height="90" rx="18" fill="#8C3A18" stroke="#D97706"/>
  <text x="430" y="278" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FEEAD9">Fixed-gain TIA</text>
  <text x="417" y="303" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#FDE68A">current to voltage</text>

  <rect x="360" y="370" width="300" height="90" rx="18" fill="#8C3A18" stroke="#D97706"/>
  <text x="417" y="408" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FEEAD9">8-bit SAR ADC</text>
  <text x="415" y="433" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#FDE68A">CDAC + comparator</text>

  <rect x="760" y="110" width="300" height="100" rx="18" fill="#5440A6" stroke="#A78BFA"/>
  <text x="832" y="149" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#EDE9FE">RV32I core</text>
  <text x="798" y="176" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#DDD6FE">reference core + ROM</text>

  <rect x="760" y="250" width="300" height="90" rx="18" fill="#5440A6" stroke="#A78BFA"/>
  <text x="818" y="288" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#EDE9FE">SAR controller</text>
  <text x="839" y="313" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#DDD6FE">8 bit trials</text>

  <rect x="760" y="390" width="300" height="90" rx="18" fill="#5440A6" stroke="#A78BFA"/>
  <text x="828" y="428" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#EDE9FE">SPI slave</text>
  <text x="813" y="453" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#DDD6FE">registers, status</text>

  <rect x="520" y="660" width="430" height="100" rx="20" fill="#515151" stroke="#A3A3A3"/>
  <text x="616" y="702" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#F3F4F6">External refs, clock, host</text>
  <text x="565" y="730" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#D4D4D8">VREFH, VREFL, VCM, V_EXC</text>

  <line x1="250" y1="215" x2="360" y2="145" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="250" y1="215" x2="360" y2="285" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="510" y1="200" x2="510" y2="240" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="510" y1="330" x2="510" y2="370" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="660" y1="160" x2="760" y2="160" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="910" y1="210" x2="910" y2="250" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="910" y1="340" x2="910" y2="390" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="660" y1="415" x2="760" y2="415" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="910" y1="480" x2="910" y2="660" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="360" y="555" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#D4D4D8">Analog path: excitation gen → fixed-gain TIA → 8-bit SAR ADC</text>
  <text x="760" y="560" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#D4D4D8">Digital path: RV32I core → SAR controller / SPI slave</text>
</svg>