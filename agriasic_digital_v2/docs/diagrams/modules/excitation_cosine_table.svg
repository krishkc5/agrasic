<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="5000" height="2800" viewBox="0 0 5000 2800" role="img" aria-labelledby="t d">
  <title id="t">The excitation table is a COSINE, and that is load-bearing</title>
  <desc id="d">Plot of the 16-point cosine table driving the sine DAC. Code equals 128 plus round of 127 times cos of 2 pi k over 16. Index 0 is the positive peak at code 255 and is the I positive term; index 4 is mid-code 128 and is the Q positive term; index 8 is the negative peak at code 1 and is the I negative term; index 12 is mid-code again and is the Q negative term. A sine table would put a zero crossing at index 0 and the I channel would measure nothing.</desc>
  <defs><marker id="mb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1565C0"/></marker><marker id="mg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1B5E20"/></marker><marker id="mo" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#E65100"/></marker><marker id="mp" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7B1FA2"/></marker><marker id="mr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B71C1C"/></marker><marker id="mk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#212121"/></marker><marker id="my" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#616161"/></marker></defs>
  <rect width="5000" height="2800" fill="#fff"/>
  <text x="120" y="95" font-family="Arial" font-size="38" font-weight="700" fill="#212121">The excitation table is a COSINE, and that is load-bearing</text>
  <text x="120" y="140" font-family="Arial" font-size="22" fill="#616161">Section 6.22 - sample points 0/4/8/12 must land on the drive peaks and the zero crossings</text>
  <rect x="80" y="180" width="4840" height="2500" rx="12" fill="#F5F5F5" stroke="#444" stroke-width="2"/>
  <rect x="700" y="360" width="3400" height="1200" fill="#fff" stroke="#212121" stroke-width="2"/>
  <line x1="700" y1="360.0" x2="4100" y2="360.0" stroke="#E0E0E0" stroke-width="2"/>
  <text x="675" y="369.0" font-family="Arial" font-size="22" text-anchor="end" fill="#616161" xml:space="preserve">255</text>
  <line x1="700" y1="657.6377952755905" x2="4100" y2="657.6377952755905" stroke="#E0E0E0" stroke-width="2"/>
  <text x="675" y="666.6377952755905" font-family="Arial" font-size="22" text-anchor="end" fill="#616161" xml:space="preserve">192</text>
  <line x1="700" y1="960.0" x2="4100" y2="960.0" stroke="#E0E0E0" stroke-width="2"/>
  <text x="675" y="969.0" font-family="Arial" font-size="22" text-anchor="end" fill="#616161" xml:space="preserve">128</text>
  <line x1="700" y1="1262.3622047244094" x2="4100" y2="1262.3622047244094" stroke="#E0E0E0" stroke-width="2"/>
  <text x="675" y="1271.3622047244094" font-family="Arial" font-size="22" text-anchor="end" fill="#616161" xml:space="preserve">64</text>
  <line x1="700" y1="1560.0" x2="4100" y2="1560.0" stroke="#E0E0E0" stroke-width="2"/>
  <text x="675" y="1569.0" font-family="Arial" font-size="22" text-anchor="end" fill="#616161" xml:space="preserve">1</text>
  <text x="675" y="330" font-family="Arial" font-size="22" font-weight="700" text-anchor="end" fill="#212121" xml:space="preserve">code</text>
  <polyline points="790,360 1005,407 1219,535 1434,729 1649,960 1863,1191 2078,1385 2293,1513 2507,1560 2722,1513 2937,1385 3151,1191 3366,960 3581,729 3795,535 4010,407" fill="none" stroke="#BDBDBD" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="790" cy="360" r="16" fill="#B71C1C"/>
  <text x="790" y="1600" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#212121" xml:space="preserve">0</text>
  <text x="790" y="1640" font-family="Arial" font-size="26" font-weight="700" text-anchor="middle" fill="#B71C1C" xml:space="preserve">I+</text>
  <line x1="790" y1="360" x2="790" y2="1560" stroke="#B71C1C" stroke-width="2"/>
  <circle cx="1005" cy="407" r="10" fill="#1565C0"/>
  <text x="1005" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">1</text>
  <circle cx="1219" cy="535" r="10" fill="#1565C0"/>
  <text x="1219" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">2</text>
  <circle cx="1434" cy="729" r="10" fill="#1565C0"/>
  <text x="1434" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">3</text>
  <circle cx="1649" cy="960" r="16" fill="#7B1FA2"/>
  <text x="1649" y="1600" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#212121" xml:space="preserve">4</text>
  <text x="1649" y="1640" font-family="Arial" font-size="26" font-weight="700" text-anchor="middle" fill="#7B1FA2" xml:space="preserve">Q+</text>
  <line x1="1649" y1="960" x2="1649" y2="1560" stroke="#7B1FA2" stroke-width="2"/>
  <circle cx="1863" cy="1191" r="10" fill="#1565C0"/>
  <text x="1863" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">5</text>
  <circle cx="2078" cy="1385" r="10" fill="#1565C0"/>
  <text x="2078" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">6</text>
  <circle cx="2293" cy="1513" r="10" fill="#1565C0"/>
  <text x="2293" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">7</text>
  <circle cx="2507" cy="1560" r="16" fill="#B71C1C"/>
  <text x="2507" y="1600" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#212121" xml:space="preserve">8</text>
  <text x="2507" y="1640" font-family="Arial" font-size="26" font-weight="700" text-anchor="middle" fill="#B71C1C" xml:space="preserve">I-</text>
  <line x1="2507" y1="1560" x2="2507" y2="1560" stroke="#B71C1C" stroke-width="2"/>
  <circle cx="2722" cy="1513" r="10" fill="#1565C0"/>
  <text x="2722" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">9</text>
  <circle cx="2937" cy="1385" r="10" fill="#1565C0"/>
  <text x="2937" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">10</text>
  <circle cx="3151" cy="1191" r="10" fill="#1565C0"/>
  <text x="3151" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">11</text>
  <circle cx="3366" cy="960" r="16" fill="#7B1FA2"/>
  <text x="3366" y="1600" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#212121" xml:space="preserve">12</text>
  <text x="3366" y="1640" font-family="Arial" font-size="26" font-weight="700" text-anchor="middle" fill="#7B1FA2" xml:space="preserve">Q-</text>
  <line x1="3366" y1="960" x2="3366" y2="1560" stroke="#7B1FA2" stroke-width="2"/>
  <circle cx="3581" cy="729" r="10" fill="#1565C0"/>
  <text x="3581" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">13</text>
  <circle cx="3795" cy="535" r="10" fill="#1565C0"/>
  <text x="3795" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">14</text>
  <circle cx="4010" cy="407" r="10" fill="#1565C0"/>
  <text x="4010" y="1600" font-family="Arial" font-size="22" text-anchor="middle" fill="#616161" xml:space="preserve">15</text>
  <text x="2400.0" y="1690" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle" fill="#212121" xml:space="preserve">phase_index</text>
  <rect x="4250" y="360" width="560" height="1200" rx="10" fill="#212121" stroke="#212121" stroke-width="2"/>
  <text x="4276" y="402" font-family="Arial" font-size="24" font-weight="700" fill="#fff" xml:space="preserve">Sample points</text>
  <text x="4276" y="442" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">k = 0</text>
  <text x="4276" y="472" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">  peak</text>
  <text x="4276" y="502" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">  -&gt; I positive</text>
  <text x="4276" y="532" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve"></text>
  <text x="4276" y="562" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">k = 4</text>
  <text x="4276" y="592" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">  mid-code</text>
  <text x="4276" y="622" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">  -&gt; Q positive</text>
  <text x="4276" y="652" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve"></text>
  <text x="4276" y="682" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">k = 8</text>
  <text x="4276" y="712" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">  trough</text>
  <text x="4276" y="742" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">  -&gt; I negative</text>
  <text x="4276" y="772" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve"></text>
  <text x="4276" y="802" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">k = 12</text>
  <text x="4276" y="832" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">  mid-code</text>
  <text x="4276" y="862" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">  -&gt; Q negative</text>
  <rect x="700" y="1760" width="4110" height="300" rx="10" fill="#C8E6C9" stroke="#C8E6C9" stroke-width="2"/>
  <text x="726" y="1802" font-family="Arial" font-size="26" font-weight="700" fill="#212121" xml:space="preserve">Half-period symmetry - the +/- chop contract</text>
  <text x="726" y="1842" font-family="Arial" font-size="20" fill="#212121" xml:space="preserve">code[k] + code[k+8] == 256 for every k, exactly, by construction:   255+1   245+11   218+38   177+79   128+128</text>
  <text x="726" y="1880" font-family="Arial" font-size="20" fill="#212121" xml:space="preserve">This is what makes (D(0deg) - D(180deg)) cancel offset and drift - the two samples sit on equal and opposite excursions about VCM.</text>
  <rect x="700" y="2120" width="4110" height="300" rx="10" fill="#FFCDD2" stroke="#FFCDD2" stroke-width="2"/>
  <text x="726" y="2162" font-family="Arial" font-size="26" font-weight="700" fill="#212121" xml:space="preserve">Why not a sine table</text>
  <text x="726" y="2202" font-family="Arial" font-size="20" fill="#212121" xml:space="preserve">A sine table would put a ZERO CROSSING at index 0. The FSM samples at 0/4/8/12, so the I channel would sit on</text>
  <text x="726" y="2240" font-family="Arial" font-size="20" fill="#212121" xml:space="preserve">the crossings and measure nothing at all. Cosine is not a cosmetic choice - it is what makes synchronous I/Q demodulation work.</text>
  <text x="120" y="2530" font-family="Arial" font-size="22" fill="#616161" xml:space="preserve">f_exc = f_clk / (16 N). At 160 MHz, N = 1 / 100 / 10000 gives 10 MHz / 100 kHz / 1 kHz - and the DAC update rate is 16 x f_exc, so 160 MSa/s at the top point.</text>
  <text x="120" y="2580" font-family="Arial" font-size="22" fill="#616161" xml:space="preserve">amplitude_i attenuates the EXCURSION only (an arithmetic shift of the delta), so mid-code stays at VCM and the symmetry above is preserved at every amplitude.</text>
</svg>
