<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <defs>
    <style>
      .title { font: 700 24px sans-serif; fill: #102a43; }
      .small { font: 500 15px sans-serif; fill: #1f2937; }
      .label { font: 600 17px sans-serif; fill: #0f172a; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .clk { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .data { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .tx { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .resp { fill: #fce7f3; stroke: #db2777; stroke-width: 2; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #475569; stroke-width: 1.5; fill: none; }
      .pulse { stroke: #dc2626; stroke-width: 2; fill: none; }
      .note { font: 600 14px sans-serif; fill: #7c2d12; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155" />
    </marker>
  </defs>

  <text x="60" y="42" class="title">SPI byte-timing contract: command -> dummy response</text>

  <line x1="60" y1="80" x2="1020" y2="80" class="grid"/>
  <line x1="60" y1="170" x2="1020" y2="170" class="grid"/>
  <line x1="60" y1="260" x2="1020" y2="260" class="grid"/>
  <line x1="60" y1="350" x2="1020" y2="350" class="grid"/>

  <text x="60" y="106" class="label">Host writes command byte</text>
  <rect x="120" y="110" width="210" height="42" class="data"/>
  <text x="135" y="136" class="small">CMD = 0xA8 = READ STATUS</text>

  <text x="60" y="196" class="label">SPI wrapper preloads response</text>
  <rect x="120" y="200" width="210" height="42" class="resp"/>
  <text x="130" y="226" class="small">tx_shift_q = 0x20 (illegal flag)</text>

  <text x="60" y="286" class="label">Host clocks dummy byte</text>
  <rect x="120" y="290" width="640" height="42" class="clk"/>
  <text x="135" y="317" class="small">sclk rising edges shift MISO: 0x20 sent MSB-first over 8 clocks</text>

  <text x="60" y="376" class="label">Byte complete</text>
  <rect x="120" y="360" width="180" height="32" class="tx"/>
  <text x="138" y="381" class="small">rx_valid_o pulse</text>

  <text x="390" y="120" class="small">CS_n low</text>
  <line x1="330" y1="120" x2="380" y2="120" class="line"/>
  <text x="390" y="214" class="small">response loads before dummy byte begins</text>
  <line x1="330" y1="214" x2="390" y2="214" class="line"/>
  <text x="770" y="320" class="small">MISO bit stream: 0 0 1 0 0 0 0 0</text>
  <line x1="760" y1="296" x2="835" y2="296" class="line"/>

  <path d="M 610 170 L 610 290" class="pulse"/>
  <path d="M 720 170 L 720 290" class="pulse"/>
  <path d="M 820 170 L 820 290" class="pulse"/>
  <text x="600" y="156" class="note">SCLK</text>
  <text x="840" y="156" class="note">MISO valid</text>
</svg>
