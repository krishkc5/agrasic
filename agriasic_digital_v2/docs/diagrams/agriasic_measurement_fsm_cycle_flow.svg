<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="5200" height="3200" viewBox="0 0 5200 3200" role="img" aria-labelledby="title desc">
  <title id="title">AgriASIC Measurement FSM Cycle-Level Data Flow</title>
  <desc id="desc">Detailed cycle-level sequencing diagram for measurement FSM including start gating, settle timing, D+/D- sampling phases, accumulation, done signaling, and autonomous loop control for M sample pairs.</desc>

  <defs>
    <marker id="arrowData" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#1565C0"/>
    </marker>
    <marker id="arrowCtrl" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,4 L1,7" fill="none" stroke="#64B5F6" stroke-width="1.5"/>
    </marker>
    <marker id="arrowCfg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#7B1FA2"/>
    </marker>
    <marker id="arrowError" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#D32F2F"/>
    </marker>
    <marker id="arrowInterface" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="5200" height="3200" fill="#FFFFFF"/>

  <g id="header">
    <text x="120" y="95" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#212121">Measurement FSM: Cycle-Level Sequence and Data Flow</text>
    <text x="120" y="145" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#212121">Source alignment: measurement_fsm.sv + implementation plan sequence (wake, settle, D+, D-, accumulate, done)</text>
  </g>

  <g id="wrapper">
    <rect x="80" y="220" width="5040" height="2880" rx="12" ry="12" fill="#F5F5F5" stroke="#444444" stroke-width="2"/>
    <text x="120" y="270" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#212121">FSM execution corridor (one measurement burst, repeated over M pairs)</text>
  </g>

  <g id="io_blocks">
    <rect x="180" y="520" width="900" height="260" rx="10" ry="10" fill="#212121" stroke="#212121" stroke-width="2"/>
    <text x="240" y="605" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Host / SPI Command Plane</text>
    <text x="240" y="650" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF">writes CTRL.start, mode, M pair count</text>
    <text x="240" y="686" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF">reads STATUS.done and RESULT</text>

    <rect x="180" y="890" width="900" height="260" rx="10" ry="10" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/>
    <text x="240" y="975" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#212121">Regfile / CSR</text>
    <text x="240" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">CFG_EXC, CFG_AVG, CTRL, STATUS, RESULT</text>
    <text x="240" y="1056" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">configuration and observability</text>

    <rect x="180" y="1260" width="900" height="260" rx="10" ry="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="240" y="1345" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#212121">Excitation + SAR Boundary</text>
    <text x="240" y="1390" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">exc_pol_o, conv_start_o, adc_code[7:0]</text>
    <text x="240" y="1426" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">digital-analog handshake ports</text>
  </g>

  <g id="fsm_pipeline">
    <rect x="1300" y="500" width="3600" height="2000" rx="10" ry="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
    <text x="1360" y="565" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#212121">Cycle-level pipeline for one pair and loop control</text>

    <rect x="1460" y="700" width="450" height="280" rx="10" ry="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="1510" y="780" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#212121">S_IDLE</text>
    <text x="1510" y="825" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">wait start pulse</text>
    <text x="1510" y="858" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">clear acc and counters</text>

    <rect x="2060" y="700" width="520" height="280" rx="10" ry="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="2110" y="780" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#212121">S_SETTLE_P</text>
    <text x="2110" y="825" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">set polarity = +</text>
    <text x="2110" y="858" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">wait settle_cycles</text>

    <rect x="2730" y="700" width="520" height="280" rx="10" ry="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="2780" y="780" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#212121">S_SAMPLE_D+</text>
    <text x="2780" y="825" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">assert conv_start</text>
    <text x="2780" y="858" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">capture D+</text>

    <rect x="3400" y="700" width="520" height="280" rx="10" ry="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="3450" y="780" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#212121">S_SETTLE_N</text>
    <text x="3450" y="825" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">flip polarity = -</text>
    <text x="3450" y="858" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">wait settle_cycles</text>

    <rect x="4070" y="700" width="520" height="280" rx="10" ry="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="4120" y="780" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#212121">S_SAMPLE_D-</text>
    <text x="4120" y="825" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">assert conv_start</text>
    <text x="4120" y="858" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">capture D-</text>

    <rect x="1960" y="1160" width="620" height="320" rx="10" ry="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="2010" y="1245" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#212121">S_ACCUMULATE</text>
    <text x="2010" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">pair_delta = (D+ - D-) / 2</text>
    <text x="2010" y="1323" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">acc = acc + pair_delta</text>
    <text x="2010" y="1356" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">pair_count++</text>

    <rect x="2820" y="1160" width="640" height="320" rx="10" ry="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="2870" y="1245" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#212121">S_LOOP_DECIDE</text>
    <text x="2870" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">if pair_count &lt; M: go S_SETTLE_P</text>
    <text x="2870" y="1323" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">else write RESULT and done</text>
    <text x="2870" y="1356" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">transition to S_DONE</text>

    <rect x="3720" y="1160" width="560" height="320" rx="10" ry="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="3770" y="1245" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#212121">S_DONE</text>
    <text x="3770" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">status.done = 1</text>
    <text x="3770" y="1323" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">busy = 0</text>
    <text x="3770" y="1356" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">wait clear/ack</text>

    <rect x="1960" y="1630" width="2320" height="700" rx="10" ry="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
    <text x="2020" y="1715" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#212121">Timing and safety sideband checks (required during implementation)</text>
    <text x="2040" y="1770" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">- Reset during any active state returns to S_IDLE with known outputs</text>
    <text x="2040" y="1810" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">- Start re-assertion while busy is ignored or explicitly flagged</text>
    <text x="2040" y="1850" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">- conv_start pulse width is one programmable cycle</text>
    <text x="2040" y="1890" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">- ADC sample-valid timing aligned with settle window</text>
    <text x="2040" y="1930" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">- RESULT write is atomic before done assertion</text>
    <text x="2040" y="1970" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">- Optional timeout/error path on missing ADC response</text>

    <rect x="2050" y="2020" width="2140" height="230" rx="8" ry="8" fill="#FFFFFF" stroke="#D32F2F" stroke-width="2"/>
    <text x="2100" y="2090" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#212121">Error escape path</text>
    <text x="2100" y="2132" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">state timeout / invalid sequence -&gt; STATUS.error set, go S_DONE_SAFE</text>
    <text x="2100" y="2170" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">host reads error code, clears, and re-arms FSM</text>
  </g>

  <g id="connections" fill="none" stroke-linecap="round">
    <path d="M1080,650 L1460,650 L1460,760" stroke="#000000" stroke-width="3" marker-end="url(#arrowInterface)"/>
    <text x="1140" y="628" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">start cmd</text>

    <path d="M1080,1020 L1360,1020 L1360,860 L1460,860" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="8 6" marker-end="url(#arrowCfg)"/>
    <text x="1140" y="996" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">M, settle_cycles</text>

    <path d="M1080,1390 L2000,1390 L2000,840 L2060,840" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowCtrl)"/>
    <text x="1500" y="1364" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">exc_pol/conv control path</text>

    <path d="M1910,840 L2060,840" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowCtrl)"/>
    <path d="M2580,840 L2730,840" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowCtrl)"/>
    <path d="M3250,840 L3400,840" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowCtrl)"/>
    <path d="M3920,840 L4070,840" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowCtrl)"/>

    <path d="M4330,980 L4330,1160" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowData)"/>
    <text x="4350" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">D-</text>

    <path d="M2990,980 L2990,1160" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowData)"/>
    <text x="3012" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">D+</text>

    <path d="M2580,1320 L2820,1320" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowCtrl)"/>
    <path d="M3460,1320 L3720,1320" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowCtrl)"/>

    <path d="M3140,1160 L3140,1040 L2320,1040 L2320,980" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowCtrl)"/>
    <text x="3180" y="1100" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">loop if pair_count &lt; M</text>

    <path d="M4280,1320 L4680,1320 L4680,1020 L1080,1020" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowData)"/>
    <text x="4410" y="1293" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">RESULT writeback</text>

    <path d="M4280,1380 L4800,1380 L4800,700 L1080,700" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowCtrl)"/>
    <text x="4420" y="1354" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">done interrupt/status</text>

    <path d="M3140,2248 L3140,2410 L1360,2410 L1360,840 L1460,840" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrowError)"/>
    <text x="3180" y="2350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#212121">error recovery to idle-safe</text>
  </g>

  <g id="cycle_legend">
    <rect x="140" y="2580" width="4900" height="440" rx="10" ry="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
    <text x="200" y="2660" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#212121">Cycle Annotations (nominal)</text>

    <text x="200" y="2720" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#212121">c0: start sampled | c1..cN: settle(+) | cN+1: sample D+ | cN+2..c2N+1: settle(-) | c2N+2: sample D-</text>
    <text x="200" y="2760" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#212121">c2N+3: accumulate | c2N+4: loop decision | repeat for M pairs | final: RESULT stable, done asserted</text>

    <line x1="200" y1="2820" x2="380" y2="2820" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowData)"/>
    <text x="420" y="2828" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">WIRE.DATA (D+, D-, RESULT)</text>

    <line x1="1300" y1="2820" x2="1480" y2="2820" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#arrowCtrl)"/>
    <text x="1520" y="2828" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">WIRE.CTRL (state transitions, busy/done)</text>

    <line x1="2860" y1="2820" x2="3040" y2="2820" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="8 6" marker-end="url(#arrowCfg)"/>
    <text x="3080" y="2828" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">WIRE.CFG (M, settle, mode)</text>

    <line x1="4100" y1="2820" x2="4280" y2="2820" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrowError)"/>
    <text x="4320" y="2828" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212121">WIRE.ERROR (timeout/illegal path)</text>
  </g>
</svg>
