<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="5000" height="3000" viewBox="0 0 5000 3000" role="img" aria-labelledby="t d">
  <title id="t">agriasic_digital_top module block diagram</title>
  <desc id="d">Detailed top-level digital module diagram with excitation control, SAR controller, and measurement FSM connectivity.</desc>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1565C0"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#64B5F6" stroke-width="1.5"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7B1FA2"/></marker>
  </defs>
  <rect width="5000" height="3000" fill="#fff"/>
  <text x="120" y="90" font-family="Arial" font-size="38" font-weight="700" fill="#212121">Module: agriasic_digital_top</text>

  <rect x="80" y="180" width="4840" height="2740" rx="12" fill="#F5F5F5" stroke="#444" stroke-width="2"/>
  <text x="120" y="235" font-family="Arial" font-size="22" font-weight="700" fill="#212121">Integration shell for measurement datapath and control handshakes</text>

  <rect x="340" y="460" width="900" height="260" rx="10" fill="#212121" stroke="#212121" stroke-width="2"/>
  <text x="390" y="540" font-family="Arial" font-size="28" font-weight="700" fill="#fff">Top-level inputs</text>
  <text x="390" y="585" font-family="Arial" font-size="19" fill="#fff">clk, rst_n, start, adc_code_i</text>
  <text x="390" y="620" font-family="Arial" font-size="19" fill="#fff">cfg_pair_log2, cfg_settle, cfg_div, cfg_conv</text>

  <rect x="1480" y="470" width="980" height="340" rx="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="1530" y="555" font-family="Arial" font-size="30" font-weight="700" fill="#212121">u_measurement_fsm</text>
  <text x="1530" y="600" font-family="Arial" font-size="20" fill="#212121">measurement_fsm.sv</text>
  <text x="1530" y="635" font-family="Arial" font-size="18" fill="#212121">state sequencing, pair loop, accumulation</text>
  <text x="1530" y="668" font-family="Arial" font-size="18" fill="#212121">exc_set_phase, sample_req, sample_phase</text>

  <rect x="1480" y="980" width="980" height="320" rx="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="1530" y="1065" font-family="Arial" font-size="30" font-weight="700" fill="#212121">u_excitation_ctrl</text>
  <text x="1530" y="1110" font-family="Arial" font-size="20" fill="#212121">excitation_ctrl.sv</text>
  <text x="1530" y="1145" font-family="Arial" font-size="18" fill="#212121">phase set, divider tick, settle_done</text>

  <rect x="1480" y="1470" width="980" height="320" rx="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="1530" y="1555" font-family="Arial" font-size="30" font-weight="700" fill="#212121">u_sar_controller</text>
  <text x="1530" y="1600" font-family="Arial" font-size="20" fill="#212121">sar_controller.sv</text>
  <text x="1530" y="1635" font-family="Arial" font-size="18" fill="#212121">conv_start pulse, conversion latency, D+/D- capture</text>

  <rect x="2860" y="860" width="1460" height="540" rx="10" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/>
  <text x="2920" y="940" font-family="Arial" font-size="30" font-weight="700" fill="#212121">Top-level outputs</text>
  <text x="2920" y="990" font-family="Arial" font-size="20" fill="#212121">conv_start_o, exc_pol_o, busy_o, done_o, result_o</text>
  <text x="2920" y="1030" font-family="Arial" font-size="20" fill="#212121">interfaces to analog boundary + host status path</text>

  <path d="M1240,560 L1480,560" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="8 6" fill="none" marker-end="url(#a3)"/>
  <text x="1260" y="535" font-family="Arial" font-size="17" fill="#212121">cfg_pair_log2</text>
  <path d="M1240,630 L2000,630 L2000,980" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="8 6" fill="none" marker-end="url(#a3)"/>
  <text x="1260" y="606" font-family="Arial" font-size="17" fill="#212121">cfg_settle/cfg_div</text>
  <path d="M1240,680 L2100,680 L2100,1470" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="8 6" fill="none" marker-end="url(#a3)"/>
  <text x="1260" y="704" font-family="Arial" font-size="17" fill="#212121">cfg_conv</text>

  <path d="M2460,620 L2860,620 L2860,980" stroke="#64B5F6" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <text x="2485" y="595" font-family="Arial" font-size="17" fill="#212121">exc_set_phase, sample_req</text>
  <path d="M2460,1080 L1480,1080" stroke="#64B5F6" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <text x="2050" y="1055" font-family="Arial" font-size="17" fill="#212121">settled_i</text>

  <path d="M2460,1630 L2860,1630 L2860,1120" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#a1)"/>
  <text x="2485" y="1605" font-family="Arial" font-size="17" fill="#212121">D+/D- and sample_done</text>
  <path d="M2460,1560 L2860,1560 L2860,920" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#a1)"/>
  <text x="2485" y="1535" font-family="Arial" font-size="17" fill="#212121">conv_start_o</text>

  <path d="M2460,560 L2860,560 L2860,1060" stroke="#64B5F6" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <text x="2485" y="535" font-family="Arial" font-size="17" fill="#212121">busy_o/done_o/result_o</text>

  <rect x="340" y="2100" width="3980" height="640" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="2"/>
  <text x="390" y="2185" font-family="Arial" font-size="28" font-weight="700" fill="#212121">Behavior summary</text>
  <text x="390" y="2235" font-family="Arial" font-size="20" fill="#212121">1) FSM commands phase changes and sample requests.</text>
  <text x="390" y="2275" font-family="Arial" font-size="20" fill="#212121">2) Excitation block qualifies settle timing before each sample.</text>
  <text x="390" y="2315" font-family="Arial" font-size="20" fill="#212121">3) SAR block captures ADC code into D+ or D- after programmable conversion delay.</text>
  <text x="390" y="2355" font-family="Arial" font-size="20" fill="#212121">4) FSM accumulates (D+ - D-) / 2 for 2^cfg_pair_log2 pairs and raises done.</text>
  <text x="390" y="2395" font-family="Arial" font-size="20" fill="#212121">5) Outputs provide host-observable progress and result handoff.</text>

  <line x1="390" y1="2490" x2="560" y2="2490" stroke="#1565C0" stroke-width="2" marker-end="url(#a1)"/>
  <text x="600" y="2498" font-family="Arial" font-size="18" fill="#212121">WIRE.DATA</text>
  <line x1="1300" y1="2490" x2="1470" y2="2490" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="1510" y="2498" font-family="Arial" font-size="18" fill="#212121">WIRE.CTRL</text>
  <line x1="2100" y1="2490" x2="2270" y2="2490" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="8 6" marker-end="url(#a3)"/>
  <text x="2310" y="2498" font-family="Arial" font-size="18" fill="#212121">WIRE.CFG</text>
</svg>
