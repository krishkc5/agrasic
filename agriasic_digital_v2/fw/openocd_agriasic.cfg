# OpenOCD target configuration for the AgriASIC RV32 control core (Ibex +
# riscv-dbg, Phase 2). Pair it with an adapter file, e.g.
#
#   openocd -f interface/ftdi/olimex-arm-usb-ocd-h.cfg -f openocd_agriasic.cfg
#   openocd -f interface/jlink.cfg -c "transport select jtag" -f openocd_agriasic.cfg
#
# then in another terminal:
#
#   riscv64-unknown-elf-gdb agriasic_fw.elf
#   (gdb) target extended-remote :3333
#   (gdb) load                # writes .text into IMEM at 0x0 (progbuf or sysbus)
#   (gdb) monitor reset halt  # ndmreset: core + peripheral bridge, IMEM kept
#   (gdb) x/16xw 0x00010100   # OUT_* results in the relocated RAM
#
# Address map (agriasic_rv32i_bus.sv): IMEM 0x0000_0000 (4 KiB, writable),
# DMEM 0x0001_0000 (2 KiB), DM 0x1A11_0000, MMIO 0x8000_0000.
#
# The hart is held in reset (and reported "unavailable") while the chip's
# start_i input is low; raise start_i before expecting `halt` to succeed.

transport select jtag

# TCK must be well below the core clock: dmi_jtag crosses TCK -> clk with a
# 2-phase handshake. 1 MHz is safe for any core clock above ~10 MHz.
adapter speed 1000

set _CHIPNAME agriasic
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x14341001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# Memory access: try the program buffer (hart executes the loads/stores, so it
# sees exactly the core's view) and fall back to the system bus (works while
# the hart is unavailable, and is what a fresh chip with no firmware needs).
riscv set_mem_access progbuf sysbus

# Scratch area for OpenOCD algorithms, in RAM above the firmware's results.
$_TARGETNAME configure -work-area-phys 0x00010400 -work-area-size 0x200 -work-area-backup 0

riscv set_reset_timeout_sec 5
riscv set_command_timeout_sec 5

init
