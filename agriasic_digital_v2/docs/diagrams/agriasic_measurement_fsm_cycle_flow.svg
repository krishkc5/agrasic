<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="5200" height="3200" viewBox="0 0 5200 3200" role="img" aria-labelledby="title desc">
  <title id="title">AgriASIC Measurement FSM Cycle-Level Data Flow</title>
  <desc id="desc">Rev 4.3 fourteen-state measurement sequence. After settling, the FSM waits on phase_index reaching 0, 180, 90 and 270 degrees in turn, taking a sample at each and folding the 0/180 pair into the I accumulator and the 90/270 pair into Q, repeating for M pairs before snapshotting both into shadow registers.</desc>

  <defs>
    <marker id="arrowData" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#1565C0"/>
    </marker>
    <marker id="arrowCtrl" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,4 L1,7" fill="none" stroke="#64B5F6" stroke-width="1.5"/>
    </marker>
    <marker id="arrowCfg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#7B1FA2"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#2E7D32"/>
    </marker>
  </defs>

  <rect width="5200" height="3200" fill="#fff"/>
  <text x="120" y="92" font-family="Arial" font-size="40" font-weight="700" fill="#212121">Measurement FSM -- cycle-level sequence</text>
  <text x="120" y="140" font-family="Arial" font-size="22" fill="#616161">Rev 4.3 -- redrawn for 14 states. Replaces the 8-state SETTLE_P / SAMPLE / ACCUM design; sampling is now gated on phase_index, and I and Q accumulate separately.</text>

  <rect x="120" y="196" width="4960" height="120" rx="10" fill="#EDE7F6" stroke="#7B1FA2" stroke-width="2"/>
  <text x="170" y="252" font-family="Arial" font-size="24" font-weight="700" fill="#4A148C">The FSM never sets a phase. It waits for one.</text>
  <text x="170" y="292" font-family="Arial" font-size="21" fill="#4A148C">Each WAIT state holds until the free-running excitation counter reaches its phase index; the strobe follows the excitation, never the other way round.</text>

  <text x="120" y="420" font-family="Arial" font-size="24" font-weight="700" fill="#616161">ENTRY</text>

  <rect x="300" y="440" width="740" height="230" rx="12" fill="#ECEFF1" stroke="#546E7A" stroke-width="2"/>
  <text x="670" y="530" font-family="Arial" font-size="30" font-weight="700" fill="#212121" text-anchor="middle">S_IDLE</text>
  <text x="670" y="576" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">busy low, done low</text>
  <text x="670" y="612" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">waits for start</text>

  <rect x="1180" y="440" width="740" height="230" rx="12" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="1550" y="530" font-family="Arial" font-size="30" font-weight="700" fill="#212121" text-anchor="middle">S_SETTLE</text>
  <text x="1550" y="576" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">counts cfg_settle</text>
  <text x="1550" y="612" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">excitation PERIODS</text>

  <path d="M1040,555 L1176,555" stroke="#64B5F6" stroke-width="2" fill="none" marker-end="url(#arrowCtrl)"/>
  <text x="1108" y="530" font-family="Arial" font-size="18" fill="#212121" text-anchor="middle">start</text>

  <text x="120" y="860" font-family="Arial" font-size="24" font-weight="700" fill="#1565C0">I CHANNEL</text>
  <text x="120" y="896" font-family="Arial" font-size="19" fill="#616161">0 vs 180 deg</text>

  <rect x="300" y="800" width="740" height="230" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="670" y="880" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_WAIT_0</text>
  <text x="670" y="926" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">until phase_index</text>
  <text x="670" y="960" font-family="Arial" font-size="19" font-weight="700" fill="#4A148C" text-anchor="middle">== 0</text>

  <rect x="1180" y="800" width="740" height="230" rx="12" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="1550" y="880" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_SAMPLE_0</text>
  <text x="1550" y="926" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">sample_req, 8 trials</text>
  <text x="1550" y="960" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">result to d_plus</text>

  <rect x="2060" y="800" width="740" height="230" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="2430" y="880" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_WAIT_180</text>
  <text x="2430" y="926" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">until phase_index</text>
  <text x="2430" y="960" font-family="Arial" font-size="19" font-weight="700" fill="#4A148C" text-anchor="middle">== 8</text>

  <rect x="2940" y="800" width="740" height="230" rx="12" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="3310" y="880" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_SAMPLE_180</text>
  <text x="3310" y="926" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">sample_req, 8 trials</text>
  <text x="3310" y="960" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">result to d_minus</text>

  <rect x="3820" y="800" width="740" height="230" rx="12" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
  <text x="4190" y="880" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_ACCUM_I</text>
  <text x="4190" y="926" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">i_acc_q +=</text>
  <text x="4190" y="960" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">d_plus - d_minus</text>

  <path d="M1550,674 L1550,720 L670,720 L670,796" stroke="#64B5F6" stroke-width="2" fill="none" marker-end="url(#arrowCtrl)"/>
  <text x="1110" y="706" font-family="Arial" font-size="18" fill="#212121" text-anchor="middle">settled</text>

  <path d="M1040,915 L1176,915" stroke="#64B5F6" stroke-width="2" fill="none" marker-end="url(#arrowCtrl)"/>
  <path d="M1920,915 L2056,915" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arrowData)"/>
  <text x="1988" y="890" font-family="Arial" font-size="18" fill="#212121" text-anchor="middle">sar_done</text>
  <path d="M2800,915 L2936,915" stroke="#64B5F6" stroke-width="2" fill="none" marker-end="url(#arrowCtrl)"/>
  <path d="M3680,915 L3816,915" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arrowData)"/>
  <text x="3748" y="890" font-family="Arial" font-size="18" fill="#212121" text-anchor="middle">sar_done</text>

  <text x="120" y="1420" font-family="Arial" font-size="24" font-weight="700" fill="#1565C0">Q CHANNEL</text>
  <text x="120" y="1456" font-family="Arial" font-size="19" fill="#616161">90 vs 270 deg</text>

  <rect x="300" y="1360" width="740" height="230" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="670" y="1440" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_WAIT_90</text>
  <text x="670" y="1486" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">until phase_index</text>
  <text x="670" y="1520" font-family="Arial" font-size="19" font-weight="700" fill="#4A148C" text-anchor="middle">== 4</text>

  <rect x="1180" y="1360" width="740" height="230" rx="12" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="1550" y="1440" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_SAMPLE_90</text>
  <text x="1550" y="1486" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">sample_req, 8 trials</text>
  <text x="1550" y="1520" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">result to d_plus</text>

  <rect x="2060" y="1360" width="740" height="230" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="2430" y="1440" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_WAIT_270</text>
  <text x="2430" y="1486" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">until phase_index</text>
  <text x="2430" y="1520" font-family="Arial" font-size="19" font-weight="700" fill="#4A148C" text-anchor="middle">== 12</text>

  <rect x="2940" y="1360" width="740" height="230" rx="12" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="3310" y="1440" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_SAMPLE_270</text>
  <text x="3310" y="1486" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">sample_req, 8 trials</text>
  <text x="3310" y="1520" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">result to d_minus</text>

  <rect x="3820" y="1360" width="740" height="230" rx="12" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
  <text x="4190" y="1440" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_ACCUM_Q</text>
  <text x="4190" y="1486" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">q_acc_q +=</text>
  <text x="4190" y="1520" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">d_plus - d_minus</text>

  <path d="M4560,915 L4900,915 L4900,1240 L200,1240 L200,1475 L296,1475" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arrowData)"/>
  <text x="2550" y="1220" font-family="Arial" font-size="19" fill="#212121" text-anchor="middle">I pair folded in -- continue to the Q pair within the same excitation period set</text>

  <path d="M1040,1475 L1176,1475" stroke="#64B5F6" stroke-width="2" fill="none" marker-end="url(#arrowCtrl)"/>
  <path d="M1920,1475 L2056,1475" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arrowData)"/>
  <text x="1988" y="1450" font-family="Arial" font-size="18" fill="#212121" text-anchor="middle">sar_done</text>
  <path d="M2800,1475 L2936,1475" stroke="#64B5F6" stroke-width="2" fill="none" marker-end="url(#arrowCtrl)"/>
  <path d="M3680,1475 L3816,1475" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arrowData)"/>
  <text x="3748" y="1450" font-family="Arial" font-size="18" fill="#212121" text-anchor="middle">sar_done</text>

  <text x="120" y="1980" font-family="Arial" font-size="24" font-weight="700" fill="#2E7D32">EXIT</text>

  <rect x="300" y="1920" width="740" height="230" rx="12" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
  <text x="670" y="2000" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_LOOP</text>
  <text x="670" y="2046" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">pair_count vs</text>
  <text x="670" y="2080" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">M = 2^cfg_pair_log2</text>

  <rect x="1180" y="1920" width="740" height="230" rx="12" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/>
  <text x="1550" y="2000" font-family="Arial" font-size="27" font-weight="700" fill="#212121" text-anchor="middle">S_DONE</text>
  <text x="1550" y="2046" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">shadow snapshot</text>
  <text x="1550" y="2080" font-family="Arial" font-size="19" fill="#424242" text-anchor="middle">done asserted</text>

  <path d="M4560,1475 L4900,1475 L4900,1800 L200,1800 L200,2035 L296,2035" stroke="#2E7D32" stroke-width="2" fill="none" marker-end="url(#arrowLoop)"/>
  <text x="2550" y="1780" font-family="Arial" font-size="19" fill="#212121" text-anchor="middle">Q pair folded in -- one full pair complete</text>

  <path d="M1040,2035 L1176,2035" stroke="#2E7D32" stroke-width="2" fill="none" marker-end="url(#arrowLoop)"/>
  <text x="1108" y="2010" font-family="Arial" font-size="18" fill="#212121" text-anchor="middle">count == M</text>

  <path d="M670,1916 L670,1700 L120,1700 L120,880 L296,880" stroke="#2E7D32" stroke-width="2" fill="none" marker-end="url(#arrowLoop)"/>
  <text x="700" y="1770" font-family="Arial" font-size="19" font-weight="700" fill="#2E7D32">count &lt; M -- next pair, back to S_WAIT_0</text>

  <path d="M1550,2154 L1550,2280 L670,2280 L670,676" stroke="#546E7A" stroke-width="2" stroke-dasharray="9 7" fill="none" marker-end="url(#arrowCtrl)"/>
  <text x="1110" y="2318" font-family="Arial" font-size="18" fill="#546E7A" text-anchor="middle">start deasserted -- return to idle</text>

  <rect x="2200" y="1900" width="2880" height="620" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="2"/>
  <text x="2260" y="1976" font-family="Arial" font-size="26" font-weight="700" fill="#212121">Sequence notes</text>
  <text x="2260" y="2028" font-family="Arial" font-size="20" fill="#212121">- Four samples per pair, not two. I and Q each need their own plus/minus pair.</text>
  <text x="2260" y="2068" font-family="Arial" font-size="20" fill="#212121">- Each S_SAMPLE_* costs eight comparator regeneration waits, one per bit trial.</text>
  <text x="2260" y="2108" font-family="Arial" font-size="20" fill="#212121">- Accumulators hold raw signed differences. There is no /2 and no on-die scaling.</text>
  <text x="2260" y="2148" font-family="Arial" font-size="20" fill="#212121">- cfg_settle counts whole excitation periods, so its cost scales with the selected frequency.</text>
  <text x="2260" y="2188" font-family="Arial" font-size="20" fill="#212121">- The shadow snapshot means a host reading during a run sees the previous complete result,</text>
  <text x="2260" y="2228" font-family="Arial" font-size="20" fill="#212121">  never a half-updated accumulator.</text>
  <text x="2260" y="2288" font-family="Arial" font-size="20" fill="#212121">- A WAIT state can span most of an excitation period; at the 1 kHz point that is the</text>
  <text x="2260" y="2328" font-family="Arial" font-size="20" fill="#212121">  dominant term in total measurement time.</text>

  <line x1="2260" y1="2412" x2="2430" y2="2412" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowData)"/>
  <text x="2470" y="2420" font-family="Arial" font-size="18" fill="#212121">sample data</text>
  <line x1="3060" y1="2412" x2="3230" y2="2412" stroke="#64B5F6" stroke-width="2" marker-end="url(#arrowCtrl)"/>
  <text x="3270" y="2420" font-family="Arial" font-size="18" fill="#212121">control / handshake</text>
  <line x1="4020" y1="2412" x2="4190" y2="2412" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowLoop)"/>
  <text x="4230" y="2420" font-family="Arial" font-size="18" fill="#212121">loop control</text>
</svg>
