<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="5000" height="2400" viewBox="0 0 5000 2400" role="img" aria-labelledby="t d">
  <title id="t">agriasic_imem / agriasic_dmem timing contract</title>
  <desc id="d">Timing contract for the memory wrappers. The address is captured on the rising clock edge while ce_i is high. On a write cycle the addressed byte lanes are written and dout_o holds its previous value. On a read cycle dout_o is valid the following cycle. dout_o also holds whenever ce_i is low. This is the no-change output policy a foundry SRAM compiler macro provides.</desc>
  <defs><marker id="mb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1565C0"/></marker><marker id="mg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1B5E20"/></marker><marker id="mo" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#E65100"/></marker><marker id="mp" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7B1FA2"/></marker><marker id="mr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B71C1C"/></marker><marker id="mk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#212121"/></marker><marker id="my" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#616161"/></marker></defs>
  <rect width="5000" height="2400" fill="#fff"/>
  <text x="120" y="95" font-family="Arial" font-size="38" font-weight="700" fill="#212121">agriasic_imem / agriasic_dmem timing contract</text>
  <text x="120" y="140" font-family="Arial" font-size="22" fill="#616161">Section 6.16 - one-cycle synchronous SRAM with a no-change output policy</text>
  <rect x="80" y="180" width="4840" height="2100" rx="12" fill="#F5F5F5" stroke="#444" stroke-width="2"/>
  <rect x="260" y="380" width="1080" height="840" rx="10" fill="#212121" stroke="#212121" stroke-width="2"/>
  <text x="286" y="422" font-family="Arial" font-size="28" font-weight="700" fill="#fff" xml:space="preserve">Inputs</text>
  <text x="286" y="462" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">clk</text>
  <text x="286" y="504" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">ce_i            chip enable</text>
  <text x="286" y="546" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">addr_i          word address</text>
  <text x="286" y="588" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">we_i[3:0]       byte write enables</text>
  <text x="286" y="630" font-family="Arial" font-size="19" fill="#fff" xml:space="preserve">din_i[31:0]     write data</text>
  <line x1="1340" y1="800" x2="1700" y2="800" stroke="#212121" stroke-width="3" marker-end="url(#mk)"/>
  <rect x="1700" y="380" width="1720" height="840" rx="10" fill="#BBDEFB" stroke="#BBDEFB" stroke-width="2"/>
  <text x="1726" y="422" font-family="Arial" font-size="28" font-weight="700" fill="#212121" xml:space="preserve">1-cycle synchronous SRAM</text>
  <text x="1726" y="462" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">address captured on the rising</text>
  <text x="1726" y="500" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">clock edge while ce_i is high</text>
  <text x="1726" y="538" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve"></text>
  <text x="1726" y="576" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">deliberately shaped so a foundry</text>
  <text x="1726" y="614" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">compiler macro can be dropped in</text>
  <text x="1726" y="652" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">without touching anything around it</text>
  <line x1="3420" y1="800" x2="3780" y2="800" stroke="#1565C0" stroke-width="3" marker-end="url(#mb)"/>
  <rect x="3780" y="380" width="960" height="840" rx="10" fill="#C8E6C9" stroke="#C8E6C9" stroke-width="2"/>
  <text x="3806" y="422" font-family="Arial" font-size="28" font-weight="700" fill="#212121" xml:space="preserve">dout_o[31:0]</text>
  <text x="3806" y="462" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">read:    valid the</text>
  <text x="3806" y="502" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">            FOLLOWING cycle</text>
  <text x="3806" y="542" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve"></text>
  <text x="3806" y="582" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">write:   HOLDS</text>
  <text x="3806" y="622" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve"></text>
  <text x="3806" y="662" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">ce_i=0:  HOLDS</text>
  <rect x="260" y="1380" width="4480" height="700" rx="10" fill="#fff" stroke="#212121" stroke-width="2"/>
  <text x="286" y="1422" font-family="Arial" font-size="26" font-weight="700" fill="#212121" xml:space="preserve">Cycle behaviour</text>
  <text x="320" y="1520" font-family="Arial" font-size="21" font-weight="700" fill="#212121" xml:space="preserve">ce_i</text>
  <text x="760" y="1520" font-family="Arial" font-size="21" font-weight="700" fill="#212121" xml:space="preserve">we_i</text>
  <text x="1300" y="1520" font-family="Arial" font-size="21" font-weight="700" fill="#212121" xml:space="preserve">this cycle</text>
  <text x="3100" y="1520" font-family="Arial" font-size="21" font-weight="700" fill="#212121" xml:space="preserve">dout_o on the next cycle</text>
  <line x1="300" y1="1550" x2="4700" y2="1550" stroke="#BDBDBD" stroke-width="2"/>
  <text x="320" y="1620" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">1</text>
  <text x="760" y="1620" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">0000</text>
  <text x="1300" y="1620" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">read addr_i</text>
  <text x="3100" y="1620" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">memory[addr_i]</text>
  <text x="320" y="1750" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">1</text>
  <text x="760" y="1750" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">non-zero</text>
  <text x="1300" y="1750" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">write the enabled byte lanes of addr_i</text>
  <text x="3100" y="1750" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">HOLDS - no read-during-write data</text>
  <text x="320" y="1880" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">0</text>
  <text x="760" y="1880" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">x</text>
  <text x="1300" y="1880" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">idle</text>
  <text x="3100" y="1880" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">HOLDS</text>
  <rect x="260" y="2130" width="4480" height="190" rx="10" fill="#FFE0B2" stroke="#FFE0B2" stroke-width="2"/>
  <text x="286" y="2172" font-family="Arial" font-size="24" font-weight="700" fill="#212121" xml:space="preserve">Instantiated vs used</text>
  <text x="286" y="2212" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">IMEM  4 KiB (1024 x 32), writable       592 B used        DMEM  2 KiB (512 x 32)       100 B used</text>
</svg>
