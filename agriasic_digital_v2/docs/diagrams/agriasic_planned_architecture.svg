<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-labelledby="t d">
  <title id="t">AgriASIC planned die architecture</title>
  <desc id="d">Block diagram of the planned AgriASIC single-die impedance sensing node: Ibex RV32IMC control core, bus interconnect with a flat address map, loadable program memory, RISC-V debug module over JTAG, SPI boot master reading firmware from external flash, memory-mapped registers driving the phase-locked measurement engine and 8-bit SAR analog front end.</desc>
  <defs>
    <style>
      .hdr    { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; font-weight: 700; fill: #d8dcd8; letter-spacing: 1.5px; }
      .grp    { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #8e948e; letter-spacing: 1.5px; }
      .blk    { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .blk2   { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .blks   { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 11px; fill: #b9bdd8; }
      .sig    { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10.5px; fill: #b4b8b4; }
      .sigc   { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10.5px; fill: #6fc9e8; }
      .sign   { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10.5px; fill: #e0b84a; }
      .addr   { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; fill: #9fd8a4; }
      .tag    { font-family: "JetBrains Mono", Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #161a16; }
      .legend { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 11px; fill: #b4b8b4; }
      .dig    { fill: #22245a; stroke: #6b6fe0; stroke-width: 1.6; }
      .ana    { fill: #3a2416; stroke: #d0823c; stroke-width: 1.6; }
      .ext    { fill: #1e221e; stroke: #8a8f8a; stroke-width: 1.4; }
      .bus    { fill: #1b2a3a; stroke: #4fa3d6; stroke-width: 1.8; }
      .die    { fill: none; stroke: #8a8f8a; stroke-width: 1.4; }
      .off    { fill: none; stroke: #8a8f8a; stroke-width: 1.2; }
      .grpbox { fill: none; stroke: #5a605a; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .fl     { stroke: #d0d4d0; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .fl2    { stroke: #d0d4d0; stroke-width: 1.4; fill: none; marker-end: url(#a); marker-start: url(#as); }
      .flc    { stroke: #6fc9e8; stroke-width: 1.6; fill: none; marker-end: url(#ac); }
      .fln    { stroke: #e0b84a; stroke-width: 1.6; fill: none; marker-end: url(#an); }
      .fln2   { stroke: #e0b84a; stroke-width: 1.6; fill: none; marker-end: url(#an); marker-start: url(#ans); }
      .fld    { stroke: #8e948e; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#ag); }
      .newtag { fill: #e0b84a; }
      .deltag { fill: #e06b6b; }
    </style>
    <marker id="a"   markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#d0d4d0"/></marker>
    <marker id="as"  markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto"><path d="M8,0 L0,3.5 L8,7 z" fill="#d0d4d0"/></marker>
    <marker id="ac"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#6fc9e8"/></marker>
    <marker id="an"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#e0b84a"/></marker>
    <marker id="ans" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto"><path d="M8,0 L0,3.5 L8,7 z" fill="#e0b84a"/></marker>
    <marker id="ag"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#8e948e"/></marker>
  </defs>

  <rect width="1320" height="790" fill="#161a16"/>

  <!-- ASIC DIE -->
  <rect x="22" y="30" width="1276" height="586" rx="10" class="die"/>
  <text x="38" y="52" class="hdr">ASIC DIE</text>

  <!-- memories row -->
  <rect x="44" y="76" width="196" height="54" rx="4" class="dig"/>
  <text x="142" y="107" class="blk" text-anchor="middle">Program memory</text>

  <rect x="262" y="76" width="170" height="54" rx="4" class="dig"/>
  <text x="347" y="107" class="blk" text-anchor="middle">Data memory</text>

  <rect x="454" y="76" width="212" height="54" rx="4" class="dig"/>
  <text x="560" y="107" class="blk" text-anchor="middle">Debug module + JTAG DTM</text>

  <!-- interconnect -->
  <rect x="44" y="190" width="622" height="56" rx="4" class="bus"/>
  <text x="355" y="222" class="blk" text-anchor="middle">Interconnect</text>

  <!-- memories to bus -->
  <path d="M90,130 V190" class="fl2"/>
  <text x="96" y="150" class="sig">fetch · data-rd</text>
  <path d="M212,190 V130" class="fl"/>
  <text x="218" y="176" class="sig">SBA / boot wr</text>

  <path d="M296,130 V190" class="fl2"/>
  <text x="302" y="165" class="sig">loads / stores</text>

  <path d="M520,130 V190" class="fl2"/>
  <text x="526" y="152" class="sig">slave port</text>
  <path d="M628,130 V190" class="fl"/>
  <text x="634" y="165" class="sig">SBA master</text>

  <!-- core row -->
  <rect x="44" y="290" width="250" height="60" rx="4" class="dig"/>
  <text x="169" y="324" class="blk" text-anchor="middle">Ibex RV32IMC core</text>

  <path d="M169,290 V246" class="fl2"/>
  <text x="175" y="272" class="sig">instr · data ports</text>

  <!-- debug_req / ndmreset: DM top, along the die's top edge, down the left gutter, into the core -->
  <path d="M560,76 V64 H32 V320 H44" class="fl"/>
  <text x="36" y="262" class="sig">debug_req</text>
  <text x="36" y="274" class="sig">ndmreset</text>

  <!-- SPI boot master -->
  <rect x="330" y="290" width="200" height="60" rx="4" class="dig"/>
  <text x="430" y="324" class="blk" text-anchor="middle">SPI boot master</text>

  <path d="M430,290 V246" class="fl"/>
  <text x="436" y="272" class="sig">loads image</text>
  <path d="M330,335 H294" class="fl"/>
  <text x="312" y="366" class="sig" text-anchor="middle">fw_valid</text>

  <!-- host / registers row -->
  <rect x="44" y="410" width="170" height="66" rx="4" class="dig"/>
  <text x="129" y="447" class="blk" text-anchor="middle">SPI host interface</text>

  <rect x="300" y="410" width="240" height="66" rx="4" class="dig"/>
  <text x="420" y="447" class="blk" text-anchor="middle">Memory-mapped registers</text>

  <path d="M600,246 V422 H540" class="fl"/>
  <text x="606" y="300" class="sig">MMIO</text>

  <!-- DONE irq back to core -->
  <path d="M300,428 H100 V350" class="flc"/>
  <text x="106" y="384" class="sigc">irq_fast[0] (DONE)</text>

  <!-- registers -> SPI slave results (target, GAP-11) -->
  <path d="M300,452 H214" class="fld"/>
  <text x="257" y="500" class="sig" text-anchor="middle">results</text>

  <!-- MEASUREMENT ENGINE -->
  <rect x="740" y="76" width="264" height="470" rx="6" class="grpbox"/>
  <text x="756" y="94" class="grp">MEASUREMENT ENGINE</text>

  <rect x="772" y="112" width="200" height="46" rx="4" class="dig"/>
  <text x="872" y="140" class="blk" text-anchor="middle">Excitation generator</text>

  <rect x="772" y="262" width="200" height="50" rx="4" class="dig"/>
  <text x="872" y="292" class="blk" text-anchor="middle">Measurement FSM</text>

  <rect x="772" y="430" width="200" height="46" rx="4" class="dig"/>
  <text x="872" y="458" class="blk" text-anchor="middle">SAR controller</text>

  <path d="M820,262 V158" class="fl"/>
  <text x="760" y="215" class="sig">exc_enable</text>
  <path d="M924,158 V262" class="flc"/>
  <text x="930" y="205" class="sigc">phase_index</text>
  <text x="930" y="217" class="sigc">period_tick</text>

  <path d="M820,312 V430" class="fl"/>
  <text x="826" y="366" class="sig">sample_req</text>
  <path d="M924,430 V312" class="fl"/>
  <text x="930" y="392" class="sig">sar_done</text>
  <text x="930" y="404" class="sig">d_plus / d_minus</text>

  <!-- registers <-> FSM -->
  <path d="M540,447 H700 V282 H772" class="fl"/>
  <text x="606" y="441" class="sig">cfg, start</text>
  <path d="M784,312 V462 H540" class="fl"/>
  <text x="606" y="474" class="sig">done, result_i/q</text>

  <!-- ANALOG FRONT END -->
  <rect x="1030" y="76" width="180" height="470" rx="6" class="grpbox"/>
  <text x="1046" y="94" class="grp">ANALOG FRONT END</text>

  <rect x="1040" y="118" width="78" height="50" rx="4" class="ana"/>
  <text x="1079" y="139" class="blk2" text-anchor="middle">Temperature</text>
  <text x="1079" y="155" class="blk2" text-anchor="middle">sensor</text>
  <rect x="1128" y="118" width="72" height="50" rx="4" class="ana"/>
  <text x="1164" y="139" class="blk2" text-anchor="middle">Wideband</text>
  <text x="1164" y="155" class="blk2" text-anchor="middle">TIA</text>

  <rect x="1040" y="240" width="160" height="46" rx="4" class="ana"/>
  <text x="1120" y="268" class="blk" text-anchor="middle">Analog mux</text>

  <rect x="1040" y="430" width="160" height="46" rx="4" class="ana"/>
  <text x="1120" y="458" class="blk" text-anchor="middle">8-bit SAR ADC</text>

  <path d="M1079,168 V240" class="fl"/>
  <path d="M1164,168 V240" class="fl"/>
  <path d="M1120,286 V430" class="fl"/>
  <text x="1126" y="360" class="sig">V_sense</text>

  <path d="M972,282 H1040 V286" class="fl"/>
  <text x="985" y="276" class="sig">mux_sel</text>
  <path d="M972,448 H1040" class="fl"/>
  <text x="978" y="438" class="sig">adc_dac·en</text>
  <text x="992" y="459" class="sig">sample</text>
  <path d="M1040,466 H972" class="fl"/>
  <text x="985" y="480" class="sig">adc_comp</text>

  <!-- excitation drive to electrodes (over the top, down the right margin) -->
  <path d="M872,112 V60 H1240 V690" class="fl"/>
  <text x="880" y="56" class="sig">drive_p / drive_n</text>
  <!-- return current back to the TIA -->
  <path d="M1268,690 V200 H1164 V168" class="fl"/>
  <text x="1284" y="440" class="sig" transform="rotate(90 1284 440)">I_return</text>

  <!-- OFF-CHIP -->
  <rect x="22" y="640" width="1276" height="130" rx="10" class="off"/>
  <text x="38" y="662" class="hdr">OFF-CHIP</text>

  <rect x="44" y="690" width="130" height="60" rx="4" class="ext"/>
  <text x="109" y="724" class="blk" text-anchor="middle">SPI host</text>

  <rect x="206" y="690" width="150" height="60" rx="4" class="ext"/>
  <text x="281" y="724" class="blk" text-anchor="middle">External SPI flash</text>

  <rect x="400" y="690" width="160" height="60" rx="4" class="ext"/>
  <text x="480" y="724" class="blk" text-anchor="middle">JTAG debugger</text>

  <rect x="760" y="690" width="120" height="60" rx="4" class="ext"/>
  <text x="820" y="724" class="blk" text-anchor="middle">Clock</text>

  <rect x="920" y="690" width="180" height="60" rx="4" class="ext"/>
  <text x="1010" y="724" class="blk" text-anchor="middle">Reference voltages</text>

  <rect x="1140" y="690" width="150" height="60" rx="4" class="ext"/>
  <text x="1215" y="724" class="blk" text-anchor="middle">Soil electrodes</text>

  <!-- off-chip connections -->
  <path d="M109,690 V476" class="fl2"/>
  <text x="116" y="600" class="sig">commands · results</text>

  <path d="M281,690 V372 H430 V350" class="fl2"/>
  <text x="290" y="560" class="sig">4 pads: SCK CS_N MOSI MISO</text>

  <path d="M480,690 V630 H725 V476 a14.5 14.5 0 0 1 0 -29 V103 H666" class="fl2"/>
  <text x="492" y="676" class="sig">5 pads: TCK TMS TRST_N TDI TDO</text>

  <path d="M820,690 V616" class="fl"/>
  <text x="828" y="636" class="sig">clk</text>
  <path d="M1010,690 V616" class="fl"/>
  <text x="1018" y="636" class="sig">references</text>

</svg>
