<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AgriASIC Digital Design - Measurement Sequence Timing</title>
  <desc id="desc">Slide 4: cycle-level execution timeline for one positive and one negative sample pair.</desc>

  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="80" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#0F172A">Measurement Timeline (One Pair)</text>

  <rect x="70" y="130" width="1780" height="900" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <rect x="110" y="190" width="1700" height="110" rx="10" fill="#EEF2FF"/>
  <text x="140" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A">State flow: RV32I start/config -> IDLE -> SETTLE_P -> SAMPLE_P -> SETTLE_N -> SAMPLE_N -> ACCUM -> LOOP -> DONE</text>

  <line x1="180" y1="360" x2="1740" y2="360" stroke="#64748B" stroke-width="2"/>
  <line x1="180" y1="480" x2="1740" y2="480" stroke="#64748B" stroke-width="2"/>
  <line x1="180" y1="600" x2="1740" y2="600" stroke="#64748B" stroke-width="2"/>
  <line x1="180" y1="720" x2="1740" y2="720" stroke="#64748B" stroke-width="2"/>

  <text x="95" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0F172A">exc_phase</text>
  <text x="95" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0F172A">settled</text>
  <text x="95" y="605" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0F172A">conv_start</text>
  <text x="95" y="725" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0F172A">sample_done</text>

  <rect x="240" y="320" width="220" height="80" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="285" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">SETTLE_P</text>
  <rect x="460" y="320" width="180" height="80" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="505" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">SAMPLE_P</text>
  <rect x="640" y="320" width="220" height="80" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="685" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">SETTLE_N</text>
  <rect x="860" y="320" width="180" height="80" fill="#FEF3C7" stroke="#D97706"/>
  <text x="905" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">SAMPLE_N</text>
  <rect x="1040" y="320" width="160" height="80" fill="#E2E8F0" stroke="#475569"/>
  <text x="1085" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">ACCUM</text>
  <rect x="1200" y="320" width="160" height="80" fill="#E2E8F0" stroke="#475569"/>
  <text x="1248" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">LOOP</text>
  <rect x="1360" y="320" width="140" height="80" fill="#E2E8F0" stroke="#475569"/>
  <text x="1400" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">DONE</text>

  <path d="M240 360 L640 360" stroke="#2563EB" stroke-width="6" fill="none"/>
  <path d="M640 360 L640 390 L860 390 L860 360" stroke="#DC2626" stroke-width="6" fill="none"/>

  <path d="M260 480 L430 480" stroke="#16A34A" stroke-width="6"/>
  <path d="M670 480 L830 480" stroke="#16A34A" stroke-width="6"/>

  <path d="M500 600 L500 570" stroke="#0EA5E9" stroke-width="6"/>
  <path d="M920 600 L920 570" stroke="#0EA5E9" stroke-width="6"/>

  <path d="M560 720 L560 690" stroke="#7C3AED" stroke-width="6"/>
  <path d="M980 720 L980 690" stroke="#7C3AED" stroke-width="6"/>

  <rect x="110" y="790" width="1700" height="200" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="140" y="845" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">Behavioral checks mapped to RTL</text>
  <text x="140" y="890" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">1. RV32I or host writes config, then issues start into the measurement engine.</text>
  <text x="140" y="925" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">2. SAMPLE_P captures D+, SAMPLE_N captures D- through SAR done pulse.</text>
  <text x="140" y="960" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">3. LOOP exits when pair_count >= 2^pair_log2, then DONE sets status visibility.</text>
</svg>
