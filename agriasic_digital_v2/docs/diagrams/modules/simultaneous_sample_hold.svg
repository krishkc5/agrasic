<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="5000" height="2200" viewBox="0 0 5000 2200" role="img" aria-labelledby="t d">
  <title id="t">Simultaneous sample-and-hold</title>
  <desc id="d">Simultaneous sample-and-hold. A single strobe at the target phase point freezes both the voltage and the current sample-and-hold. The analog mux then presents each held value to the one SAR ADC in turn. The voltage/current phase relationship is set by that single instant, not by the order or the spacing of the two conversions, so skew between them costs nothing.</desc>
  <defs><marker id="mb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1565C0"/></marker><marker id="mg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1B5E20"/></marker><marker id="mo" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#E65100"/></marker><marker id="mp" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7B1FA2"/></marker><marker id="mr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B71C1C"/></marker><marker id="mk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#212121"/></marker><marker id="my" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#616161"/></marker></defs>
  <rect width="5000" height="2200" fill="#fff"/>
  <text x="120" y="95" font-family="Arial" font-size="38" font-weight="700" fill="#212121">Simultaneous sample-and-hold</text>
  <text x="120" y="140" font-family="Arial" font-size="22" fill="#616161">Section 6.21 - ONE strobe freezes both channels; the conversions may then be skewed</text>
  <rect x="80" y="180" width="4840" height="1900" rx="12" fill="#F5F5F5" stroke="#444" stroke-width="2"/>
  <rect x="260" y="330" width="1100" height="180" rx="10" fill="#BBDEFB" stroke="#BBDEFB" stroke-width="2"/>
  <text x="286" y="372" font-family="Arial" font-size="26" font-weight="700" fill="#212121" xml:space="preserve">phase point reached</text>
  <line x1="810" y1="510" x2="810" y2="680" stroke="#E65100" stroke-width="4" marker-end="url(#mo)"/>
  <text x="860" y="620" font-family="Arial" font-size="24" font-weight="700" fill="#E65100" xml:space="preserve">ONE strobe  (afe_sample_o)</text>
  <rect x="260" y="680" width="1100" height="220" rx="10" fill="#FFE0B2" stroke="#FFE0B2" stroke-width="2"/>
  <text x="286" y="722" font-family="Arial" font-size="28" font-weight="700" fill="#212121" xml:space="preserve">S/H   dV</text>
  <text x="286" y="762" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">differential PGA on E2/E3</text>
  <rect x="260" y="960" width="1100" height="220" rx="10" fill="#FFE0B2" stroke="#FFE0B2" stroke-width="2"/>
  <text x="286" y="1002" font-family="Arial" font-size="28" font-weight="700" fill="#212121" xml:space="preserve">S/H   I</text>
  <text x="286" y="1042" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">TIA on E4</text>
  <path d="M1360,790 L1700,790 L1700,930" fill="none" stroke="#E65100" stroke-width="3"/>
  <path d="M1360,1070 L1700,1070 L1700,930" fill="none" stroke="#E65100" stroke-width="3"/>
  <line x1="1700" y1="930" x2="2100" y2="930" stroke="#E65100" stroke-width="3" marker-end="url(#mo)"/>
  <text x="1450" y="900" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">afe_mux_sel_o</text>
  <rect x="2100" y="810" width="1000" height="240" rx="10" fill="#C8E6C9" stroke="#C8E6C9" stroke-width="2"/>
  <text x="2126" y="852" font-family="Arial" font-size="28" font-weight="700" fill="#212121" xml:space="preserve">SAR ADC</text>
  <text x="2126" y="892" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">8-bit differential</text>
  <text x="2126" y="926" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">one converter, two channels</text>
  <line x1="3100" y1="930" x2="3500" y2="930" stroke="#1B5E20" stroke-width="3" marker-end="url(#mg)"/>
  <rect x="3500" y="810" width="1240" height="240" rx="10" fill="#BBDEFB" stroke="#BBDEFB" stroke-width="2"/>
  <text x="3526" y="852" font-family="Arial" font-size="26" font-weight="700" fill="#212121" xml:space="preserve">two conversions</text>
  <text x="3526" y="892" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">mux = 0 then mux = 1</text>
  <text x="3526" y="926" font-family="Arial" font-size="19" fill="#212121" xml:space="preserve">no new strobe between</text>
  <rect x="260" y="1320" width="4480" height="460" rx="10" fill="#fff" stroke="#212121" stroke-width="2"/>
  <text x="286" y="1362" font-family="Arial" font-size="26" font-weight="700" fill="#212121" xml:space="preserve">Why this is the whole point</text>
  <text x="286" y="1402" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">The voltage/current phase relationship is set by THAT INSTANT, not by the order the two</text>
  <text x="286" y="1438" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">conversions happen to run in. A skew between the conversions therefore costs nothing.</text>
  <text x="286" y="1474" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve"></text>
  <text x="286" y="1510" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">The alternative considered - measure dV on one excitation period and I on the next - would have made</text>
  <text x="286" y="1546" font-family="Arial" font-size="20" fill="#616161" xml:space="preserve">the phase difference depend on cycle-to-cycle excitation stability, which is exactly the quantity being measured.</text>
  <text x="120" y="1880" font-family="Arial" font-size="22" fill="#616161" xml:space="preserve">Budget: the hold must survive both conversions - roughly 425 ns of droop budget at conv_cycles = 1.</text>
</svg>
