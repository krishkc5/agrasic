  <line x1="480" y1="505" x2="570" y2="505" stroke="#D1D5DB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="640" x2="570" y2="640" stroke="#D1D5DB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715" y1="430" x2="715" y2="485" stroke="#D1D5DB" stroke-width="2" marker-end="url(#arrow)"/>
