<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="t d">
  <title id="t">Excitation control inversion, Rev 4.2 versus Rev 4.3</title>
  <desc id="d">Side-by-side comparison. In Rev 4.2 the measurement FSM commands each polarity flip, so excitation frequency is an emergent side effect of the settle and conversion register values. In Rev 4.3 a free-running divider generates excitation and exports a 16-state phase counter; the FSM strobes the sampler when the counter matches the selected phase index.</desc>
  <defs>
    <style>
      .title { font: 700 25px sans-serif; fill: #0f172a; }
      .sub   { font: 400 14px sans-serif; fill: #475569; }
      .hOld  { font: 700 17px sans-serif; fill: #b45309; }
      .hNew  { font: 700 17px sans-serif; fill: #6d28d9; }
      .lbl   { font: 700 14px sans-serif; fill: #111827; }
      .sml   { font: 400 12px sans-serif; fill: #4b5563; }
      .mono  { font: 400 12.5px ui-monospace, "Courier New", monospace; fill: #1f2937; }
      .bad   { font: 700 12.5px sans-serif; fill: #b91c1c; }
      .good  { font: 700 12.5px sans-serif; fill: #15803d; }
      .boxOld{ fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .boxNew{ fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .aOld  { stroke: #b45309; stroke-width: 2.4; fill: none; marker-end: url(#ao); }
      .aNew  { stroke: #7c3aed; stroke-width: 2.4; fill: none; marker-end: url(#an); }
      .wave  { stroke: #7c3aed; stroke-width: 2.2; fill: none; }
      .tick  { stroke: #cbd5e1; stroke-width: 1; }
      .strobe{ stroke: #dc2626; stroke-width: 2.2; fill: none; }
    </style>
    <marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker>
    <marker id="an" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7c3aed"/></marker>
  </defs>

  <rect width="1240" height="700" fill="#ffffff"/>
  <text x="40" y="42" class="title">Excitation control inverts in Rev 4.3</text>
  <text x="40" y="66" class="sub">Who owns excitation timing — and therefore whether frequency is a programmed quantity or an accident.</text>

  <!-- ================= LEFT: Rev 4.2 ================= -->
  <rect x="40" y="92" width="560" height="330" rx="12" class="panel"/>
  <text x="60" y="122" class="hOld">Rev 4.2 — FSM commands each flip</text>

  <rect x="70" y="146" width="200" height="70" rx="8" class="boxOld"/>
  <text x="170" y="176" class="lbl" text-anchor="middle">measurement_fsm</text>
  <text x="170" y="197" class="sml" text-anchor="middle">drives polarity</text>

  <rect x="380" y="146" width="190" height="70" rx="8" class="boxOld"/>
  <text x="475" y="176" class="lbl" text-anchor="middle">excitation_ctrl</text>
  <text x="475" y="197" class="sml" text-anchor="middle">follows commands</text>

  <path d="M272,170 L378,170" class="aOld"/>
  <text x="325" y="162" class="sml" text-anchor="middle">set_phase</text>
  <path d="M378,196 L274,196" class="aOld"/>
  <text x="325" y="212" class="sml" text-anchor="middle">settled</text>

  <text x="70" y="252" class="mono">f_exc = emergent from settle + conv</text>
  <text x="70" y="276" class="bad">✗ frequency cannot be set, only discovered</text>
  <text x="70" y="298" class="bad">✗ two registers jointly decide whether it hangs</text>
  <text x="70" y="320" class="bad">✗ only 2 phases available: 0° and 180°</text>
  <text x="70" y="342" class="bad">✗ cannot support equivalent-time sampling</text>
  <text x="70" y="378" class="sml">Equivalent-time sampling needs a stationary periodic</text>
  <text x="70" y="396" class="sml">stimulus. A commanded flip is not one.</text>

  <!-- ================= RIGHT: Rev 4.3 ================= -->
  <rect x="640" y="92" width="560" height="330" rx="12" class="panel"/>
  <text x="660" y="122" class="hNew">Rev 4.3 — free-running, sampler locks to phase</text>

  <rect x="670" y="146" width="200" height="70" rx="8" class="boxNew"/>
  <text x="770" y="172" class="lbl" text-anchor="middle">excitation generator</text>
  <text x="770" y="192" class="sml" text-anchor="middle">free-running divider</text>
  <text x="770" y="208" class="sml" text-anchor="middle">16-state phase counter</text>

  <rect x="980" y="146" width="190" height="70" rx="8" class="boxNew"/>
  <text x="1075" y="176" class="lbl" text-anchor="middle">measurement_fsm</text>
  <text x="1075" y="197" class="sml" text-anchor="middle">compares, strobes</text>

  <path d="M872,180 L978,180" class="aNew"/>
  <text x="925" y="171" class="sml" text-anchor="middle">phase[3:0]</text>

  <text x="670" y="252" class="mono">f_exc = f_clk / (16 · N)   N programmed</text>
  <text x="670" y="276" class="good">✓ frequency is a programmed quantity</text>
  <text x="670" y="298" class="good">✓ 16 phase states, 4 used → I and Q</text>
  <text x="670" y="320" class="good">✓ phase step = 22.5° from the divider itself</text>
  <text x="670" y="342" class="good">✓ no delay line or DLL required</text>
  <text x="670" y="378" class="sml">The FSM no longer causes excitation. It observes it</text>
  <text x="670" y="396" class="sml">and samples at the phase it was told to sample.</text>

  <!-- ================= phase-lock timing ================= -->
  <rect x="40" y="446" width="1160" height="228" rx="12" class="panel"/>
  <text x="60" y="476" class="hNew">Phase-lock mechanism — strobe fires only on index match</text>

  <!-- phase counter ruler -->
  <text x="60" y="520" class="lbl">phase counter</text>
  <text x="60" y="540" class="sml">16 states per excitation period</text>

  <g transform="translate(250,496)">
    <!-- 16 ticks over two periods -->
    <line x1="0" y1="46" x2="880" y2="46" class="tick"/>
    <!-- excitation square wave: high for 8 states, low for 8 -->
    <path d="M0,20 L220,20 L220,72 L440,72 L440,20 L660,20 L660,72 L880,72" class="wave"/>
    <text x="-2" y="14" class="sml">exc</text>

    <!-- index labels at the four used phases, first period -->
    <line x1="0"   y1="12" x2="0"   y2="86" class="strobe" stroke-dasharray="4 3"/>
    <text x="0"   y="104" class="sml" text-anchor="middle">0</text>
    <text x="0"   y="120" class="sml" text-anchor="middle">0°</text>

    <line x1="110" y1="12" x2="110" y2="86" class="strobe" stroke-dasharray="4 3"/>
    <text x="110" y="104" class="sml" text-anchor="middle">4</text>
    <text x="110" y="120" class="sml" text-anchor="middle">90°</text>

    <line x1="220" y1="12" x2="220" y2="86" class="strobe" stroke-dasharray="4 3"/>
    <text x="220" y="104" class="sml" text-anchor="middle">8</text>
    <text x="220" y="120" class="sml" text-anchor="middle">180°</text>

    <line x1="330" y1="12" x2="330" y2="86" class="strobe" stroke-dasharray="4 3"/>
    <text x="330" y="104" class="sml" text-anchor="middle">12</text>
    <text x="330" y="120" class="sml" text-anchor="middle">270°</text>

    <text x="440" y="104" class="sml" text-anchor="middle">0</text>
    <text x="660" y="104" class="sml" text-anchor="middle">8</text>

    <!-- one strobe on the selected index -->
    <path d="M110,138 L110,152" class="strobe"/>
    <circle cx="110" cy="138" r="5" fill="#dc2626"/>
    <text x="126" y="146" class="sml">strobe: only when counter == REG_PHASE_IDX</text>
  </g>

  <text x="60" y="640" class="sml">One phase point is taken per excitation cycle. Over many cycles the four points assemble I and Q, so SAR conversion time</text>
  <text x="60" y="658" class="sml">never has to fit inside a half-cycle — which is what makes the 10 MHz point tractable with an 8-bit SAR.</text>
</svg>
