<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AgriASIC Digital Design - Schedule and Descope Strategy</title>
  <desc id="desc">Slide 8: phase gates, ownership outcomes, and descope ladder for schedule protection.</desc>

  <rect x="0" y="0" width="1920" height="1080" fill="#0B1020"/>
  <text x="80" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#F8FAFC">Execution Plan to Trial GDS</text>

  <rect x="70" y="130" width="1780" height="900" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>

  <rect x="120" y="190" width="780" height="380" rx="12" fill="#1E293B" stroke="#475569"/>
  <text x="155" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#E2E8F0">Milestone Gates</text>
  <text x="155" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#CBD5E1">Week 1: freeze interfaces, area, memory assumptions, firmware scope</text>
  <text x="155" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#CBD5E1">Week 3: hardened-macro checkpoint + fallback path runnable</text>
  <text x="155" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#CBD5E1">Week 4: scope gate, no feature additions after this point</text>
  <text x="155" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#CBD5E1">Week 8: extracted analog + hardened digital integrated</text>
  <text x="155" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#CBD5E1">Week 11: trial GDS package and archived closure evidence</text>

  <rect x="120" y="600" width="780" height="360" rx="12" fill="#1E293B" stroke="#475569"/>
  <text x="155" y="660" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#E2E8F0">Descope Ladder (Ordered)</text>
  <text x="155" y="710" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#CBD5E1">1. Drop optional debug routing/registers</text>
  <text x="155" y="746" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#CBD5E1">2. Reduce program/data memory footprint</text>
  <text x="155" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#CBD5E1">3. Replace or shrink the optional controller before touching FSM timing</text>
  <text x="155" y="818" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#CBD5E1">4. Keep FSM-only sequencing as final protected baseline</text>
  <text x="155" y="854" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#CBD5E1">5. Keep only essential divider options if timing closes late</text>

  <rect x="940" y="190" width="860" height="770" rx="12" fill="#172554" stroke="#1D4ED8"/>
  <text x="980" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#DBEAFE">Must-Preserve Minimum Feature Set</text>
  <text x="980" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#E0E7FF">A. On-die excitation switching/timing controls</text>
  <text x="980" y="341" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#E0E7FF">B. 8-bit SAR conversion sequencing and data capture</text>
  <text x="980" y="377" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#E0E7FF">C. Paired-sample subtraction and accumulation</text>
  <text x="980" y="413" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#E0E7FF">D. SPI read/write with deterministic protocol behavior</text>
  <text x="980" y="449" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#E0E7FF">E. Reset safety and status/result observability</text>

  <rect x="980" y="500" width="780" height="400" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="1015" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#E2E8F0">MAS-ready Artifacts Generated</text>
  <text x="1015" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#CBD5E1">- Interface contract and register map with protocol bytes</text>
  <text x="1015" y="634" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#CBD5E1">- Timing checklist for FSM/excitation/SAR/SPI paths</text>
  <text x="1015" y="668" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#CBD5E1">- Module-level RTL decomposition and ownership mapping</text>
  <text x="1015" y="702" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#CBD5E1">- Smoke TB with positive and negative protocol checks</text>
  <text x="1015" y="736" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#CBD5E1">- Protocol flow diagrams for review and design walkthrough</text>
  <text x="1015" y="770" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#CBD5E1">- Requirement trace matrix and acceptance criteria (MAS doc)</text>
  <text x="1015" y="804" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#CBD5E1">- Programming wrapper collateral for the optional RV32I layer</text>

  <text x="80" y="1050" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#94A3B8">This slide supports go/no-go decisions at weekly design reviews.</text>
</svg>
