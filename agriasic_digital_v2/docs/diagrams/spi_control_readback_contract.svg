<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <defs>
    <style>
      .title { font: 700 24px sans-serif; fill: #0f172a; }
      .label { font: 600 16px sans-serif; fill: #111827; }
      .small { font: 500 14px sans-serif; fill: #1f2937; }
      .host { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .top { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .slave { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .reg { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2; }
      .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151" />
    </marker>
  </defs>

  <text x="60" y="42" class="title">SPI status-readback contract</text>

  <rect x="90" y="90" width="150" height="70" class="host"/>
  <text x="122" y="128" class="label">Host</text>
  <text x="108" y="147" class="small">WRITE cmd=0xA8</text>

  <rect x="360" y="90" width="180" height="70" class="top"/>
  <text x="386" y="128" class="label">agriasic_digital_spi_top</text>
  <text x="392" y="147" class="small">decode addr=5, R/W=READ</text>

  <rect x="640" y="90" width="180" height="70" class="slave"/>
  <text x="680" y="128" class="label">spi_slave</text>
  <text x="657" y="147" class="small">shift MISO from tx_shift_q</text>

  <rect x="360" y="220" width="180" height="70" class="reg"/>
  <text x="384" y="257" class="label">REG_STATUS</text>
  <text x="392" y="276" class="small">status_byte = 0x20</text>

  <path d="M240 125 L360 125" class="arrow"/>
  <path d="M540 125 L640 125" class="arrow"/>
  <path d="M450 160 L450 220" class="arrow"/>
  <path d="M640 160 L640 220" class="arrow"/>
  <path d="M720 160 L720 220" class="arrow"/>

  <text x="250" y="114" class="small">command byte</text>
  <text x="540" y="114" class="small">read response</text>
  <text x="455" y="195" class="small">read_byte_from_addr()</text>
  <text x="650" y="195" class="small">dummy byte shifts status</text>

  <rect x="120" y="330" width="780" height="40" class="host"/>
  <text x="150" y="354" class="label">Host samples MISO on the dummy byte; value must match the most recent status_byte, not a stale previous register value.</text>
</svg>
