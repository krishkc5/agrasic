<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AgriASIC Digital Design - RTL Module Decomposition</title>
  <desc id="desc">Slide 6: module-level responsibility split and inter-module interfaces.</desc>

  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="80" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#0F172A">RTL Decomposition and Contracts</text>

  <rect x="70" y="130" width="1780" height="900" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <rect x="120" y="190" width="540" height="240" rx="12" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="150" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">measurement_fsm.sv</text>
  <text x="150" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Owns sequence states and pair loop termination.</text>
  <text x="150" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Consumes settled_i and sar_done_i handshake.</text>
  <text x="150" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Computes signed accumulation into result_o.</text>

  <rect x="690" y="190" width="540" height="240" rx="12" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="720" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">excitation_ctrl.sv</text>
  <text x="720" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Implements polarity update and settle countdown.</text>
  <text x="720" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Programmable divider emits timing ticks.</text>
  <text x="720" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Exports settled_o and excitation polarity.</text>

  <rect x="1260" y="190" width="540" height="240" rx="12" fill="#FEF3C7" stroke="#D97706"/>
  <text x="1290" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">sar_controller.sv</text>
  <text x="1290" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Latches sample phase and conversion countdown.</text>
  <text x="1290" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Single-cycle conv_start pulse generation.</text>
  <text x="1290" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Captures D+/D- and emits sample_done pulse.</text>

  <rect x="120" y="470" width="540" height="240" rx="12" fill="#CFFAFE" stroke="#0891B2"/>
  <text x="150" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">spi_slave.sv</text>
  <text x="150" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Mode-0 shift in SCLK domain.</text>
  <text x="150" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Toggle synchronizer for byte-valid CDC.</text>
  <text x="150" y="645" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Provides byte stream interface to wrapper.</text>

  <rect x="690" y="470" width="540" height="240" rx="12" fill="#FCE7F3" stroke="#DB2777"/>
  <text x="720" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">agriasic_digital_spi_top.sv</text>
  <text x="720" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">SPI decode, response mux, protocol legality checks.</text>
  <text x="720" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Bridges regfile config to core controls.</text>
  <text x="720" y="645" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Maintains sticky error flags and status mirror.</text>

  <rect x="1260" y="470" width="540" height="240" rx="12" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="1290" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">regfile.sv + agriasic_digital_top.sv + RV32I shell/top</text>
  <text x="1290" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">regfile: parameterized RW storage and RO mirror points.</text>
  <text x="1290" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">top: integrates FSM + excitation + SAR path.</text>
  <text x="1290" y="645" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">RV32I shell/top: firmware-facing config and start pulse path.</text>

  <rect x="120" y="760" width="1680" height="210" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="150" y="815" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F172A">Integration invariants</text>
  <text x="150" y="860" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">1. Status/result visibility is preserved independent of host timing.</text>
  <text x="150" y="895" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">2. Rejected SPI transactions cannot corrupt measurement state.</text>
  <text x="150" y="930" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">3. FSM-only path remains functional if optional programming integration is deferred.</text>
</svg>
