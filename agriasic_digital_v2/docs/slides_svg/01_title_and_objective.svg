<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AgriASIC Digital Design - Title and Objectives</title>
  <desc id="desc">Slide 1: project context, objective, and top-level value proposition.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#1B263B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>

  <rect x="90" y="100" width="1740" height="880" rx="18" fill="#FFFFFF" opacity="0.08"/>
  <rect x="130" y="150" width="1660" height="780" rx="16" fill="#F8FAFC"/>

  <text x="180" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#0F172A">Single-Die Impedance Sensing Node</text>
  <text x="180" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#334155">Digital Design Slide Set (Implementation + MAS Inputs)</text>

  <rect x="180" y="360" width="740" height="480" rx="12" fill="#E2E8F0"/>
  <text x="215" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F172A">Project Objective</text>
  <text x="215" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1E293B">Deliver a hardened digital macro that:</text>
  <text x="230" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">1. Runs autonomous measurement sequencing on-die</text>
  <text x="230" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">2. Controls excitation timing and SAR conversion handshakes</text>
  <text x="230" y="585" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">3. Exposes a robust SPI control/status interface</text>
  <text x="230" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">4. Keeps FSM-only fallback viable for schedule safety</text>
  <text x="230" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">5. Adds an optional RV32I programming layer above the FSM</text>
  <text x="230" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">6. Supports RTL-to-GDS closure in 11-week window</text>

  <rect x="960" y="360" width="790" height="220" rx="12" fill="#DBEAFE"/>
  <text x="995" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F172A">Key Cost and Energy Thesis</text>
  <text x="995" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Integration removes host round-trips per sample and reduces standby overhead.</text>
  <text x="995" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Host interaction shifts from per-sample to per-measurement reporting.</text>
  <text x="995" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Primary benefit is lifetime service cost reduction, not only BOM reduction.</text>

  <rect x="960" y="610" width="790" height="230" rx="12" fill="#DCFCE7"/>
  <text x="995" y="670" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F172A">Design Baseline in Rev 4.1</text>
  <text x="995" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">On-die: excitation timing, fixed-gain TIA path control, SAR sequencing, SPI, result accumulation.</text>
  <text x="995" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">External: VREFH/VREFL/VCM/V_EXC, master clock, power source, electrodes.</text>
  <text x="995" y="790" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1E293B">Digital implementation: measurement FSM with optional RV32I programming support.</text>

  <text x="180" y="900" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">Source basis: high-level design rev4.1 + implementation plan + timing checklist + current RTL.</text>
</svg>
