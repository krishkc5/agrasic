<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AgriASIC Digital Design - Verification and Risk Plan</title>
  <desc id="desc">Slide 7: verification matrix and highest-priority risks with mitigations.</desc>

  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="80" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#0F172A">Verification and Risk Management</text>

  <rect x="70" y="130" width="1780" height="900" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <rect x="120" y="190" width="830" height="770" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="155" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F172A">Verification Matrix (Digital Focus)</text>

  <text x="155" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">V1: Reset and startup safety</text>
  <text x="175" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">- Expected: known states, no spurious conv_start/start pulses</text>

  <text x="155" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">V2: Measurement sequence correctness</text>
  <text x="175" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">- Expected: state order and pair accumulation match reference arithmetic</text>

  <text x="155" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">V3: SPI protocol legality and alignment</text>
  <text x="175" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">- Expected: ACK/NACK/E1/E2 behavior, Byte1 discard on invalid Byte0</text>

  <text x="155" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">V4: Sticky error visibility and clear path</text>
  <text x="175" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">- Expected: STATUS[7:5] set-on-error, clear-on CTRL[7] write-one</text>

  <text x="155" y="645" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">V5: CDC soundness on SPI byte transport</text>
  <text x="175" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">- Expected: one rx_valid pulse per byte completion, no duplication</text>

  <text x="155" y="730" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">V6: Config sensitivity checks</text>
  <text x="175" y="763" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">- quick profile: pair_log2=1 settle=0 conv=0</text>
  <text x="175" y="796" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">- nominal profile: pair_log2=2 settle=2 conv=1</text>

  <rect x="980" y="190" width="830" height="770" rx="12" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="1015" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#7F1D1D">Top Risks and Controls</text>

  <text x="1015" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#7F1D1D">RISK A: Flow/schedule overrun</text>
  <text x="1035" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">Control: Week-4 feature gate + FSM-only fallback preserved</text>

  <text x="1015" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#7F1D1D">RISK B: Interface churn at analog boundary</text>
  <text x="1035" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">Control: signed contract for phase/settle/conv handshakes</text>

  <text x="1015" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#7F1D1D">RISK C: Protocol corner-case escapes</text>
  <text x="1035" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">Control: negative SPI tests + status flag assertions + replay tests</text>

  <text x="1015" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#7F1D1D">RISK D: Memory/compiler assumptions fail</text>
  <text x="1035" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">Control: Week-1 closure; shrink to ROM + small data footprint for the optional RV32I controller</text>

  <text x="1015" y="645" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#7F1D1D">RISK E: Incomplete integration evidence at handoff</text>
  <text x="1035" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">Control: archive tests, waves, checksums, and release checklist</text>

  <rect x="1015" y="740" width="760" height="180" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="1045" y="790" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A">Current Delta</text>
  <text x="1045" y="830" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">Protocol hardening added deterministic error bytes and sticky status diagnostics.</text>
  <text x="1045" y="865" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">Next evidence step is executable simulation logs once simulator path is available.</text>
  <text x="1045" y="900" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1E293B">Optional controller bring-up stays behind the timing-critical FSM baseline.</text>
</svg>
