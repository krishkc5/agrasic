  <text x="1452" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">VREFH / VREFL / VCM / V_EXC</text>

  <rect x="1430" y="445" width="290" height="95" rx="8" fill="#FFFFFF" stroke="#A3A3A3"/>
  <text x="1490" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">Master Clock</text>

  <rect x="1430" y="570" width="290" height="95" rx="8" fill="#FFFFFF" stroke="#A3A3A3"/>
  <text x="1515" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">Sensor</text>

  <rect x="1430" y="695" width="290" height="95" rx="8" fill="#FFFFFF" stroke="#A3A3A3"/>
  <text x="1460" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">Host / RV32I policy layer</text>

  <line x1="1320" y1="370" x2="1430" y2="370" stroke="#D1D5DB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1320" y1="500" x2="1430" y2="500" stroke="#D1D5DB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1320" y1="620" x2="1430" y2="620" stroke="#D1D5DB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1320" y1="740" x2="1430" y2="740" stroke="#D1D5DB" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="1040" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">Architecture intent: RV32I core plus ROM handles programming; excitation, TIA, and SAR stay on die.</text>
