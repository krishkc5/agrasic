<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AgriASIC Digital Design - System Architecture</title>
  <desc id="desc">Slide 3: integrated digital/analog boundary and data/control partitioning.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 z" fill="#0F172A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="80" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#0F172A">Integrated Node Architecture</text>

  <rect x="70" y="130" width="1780" height="880" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <rect x="140" y="220" width="1180" height="700" rx="12" fill="#1F1F1F" stroke="#4B5563" stroke-dasharray="8 7" stroke-width="2"/>
  <text x="170" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">On-Die Subsystem</text>
  <text x="170" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#D1D5DB">RV32I control path over a hard real-time analog measurement engine</text>

  <rect x="190" y="320" width="290" height="100" rx="12" fill="#8C3A18" stroke="#D97706" stroke-width="2"/>
  <text x="245" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FEEAD9">Excitation gen</text>
  <text x="230" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#FDE68A">divider, drive switch</text>

  <rect x="190" y="455" width="290" height="100" rx="12" fill="#8C3A18" stroke="#D97706" stroke-width="2"/>
  <text x="245" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FEEAD9">Fixed-gain TIA</text>
  <text x="245" y="527" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#FDE68A">current to voltage</text>

  <rect x="190" y="590" width="290" height="100" rx="12" fill="#8C3A18" stroke="#D97706" stroke-width="2"/>
  <text x="235" y="635" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FEEAD9">8-bit SAR ADC</text>
  <text x="227" y="662" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#FDE68A">CDAC + comparator</text>

  <rect x="570" y="320" width="290" height="110" rx="12" fill="#5440A6" stroke="#A78BFA" stroke-width="2"/>
  <text x="648" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#EDE9FE">RV32I core + ROM</text>
  <text x="628" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#DDD6FE">reference core + ROM</text>

  <rect x="570" y="485" width="290" height="100" rx="12" fill="#5440A6" stroke="#A78BFA" stroke-width="2"/>
  <text x="618" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#EDE9FE">SAR controller</text>
  <text x="646" y="557" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#DDD6FE">8 bit trials</text>

  <rect x="570" y="620" width="290" height="100" rx="12" fill="#5440A6" stroke="#A78BFA" stroke-width="2"/>
  <text x="650" y="665" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#EDE9FE">SPI slave</text>
  <text x="625" y="692" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#DDD6FE">registers, status</text>

