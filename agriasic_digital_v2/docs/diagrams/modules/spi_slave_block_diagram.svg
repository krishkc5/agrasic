<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="5000" height="3000" viewBox="0 0 5000 3000" role="img" aria-labelledby="t d">
  <title id="t">spi_slave module block diagram</title>
  <desc id="d">Rev 4.3 Phase 3 block diagram for spi_slave: sclk_i/cs_n_i/mosi_i are 2FF-oversampled into the clk domain and every bit/byte event is a detected edge on the synchronized signal -- there is no longer a second clock domain or toggle synchronizer inside this module.</desc>
  <defs>
    <marker id="p1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1565C0"/></marker>
    <marker id="p2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#64B5F6" stroke-width="1.5"/></marker>
    <marker id="p3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7B1FA2"/></marker>
  </defs>
  <rect width="5000" height="3000" fill="#fff"/>
  <text x="120" y="95" font-family="Arial" font-size="38" font-weight="700" fill="#212121">Module: spi_slave</text>
  <text x="120" y="140" font-family="Arial" font-size="22" fill="#616161">Rev 4.3 Phase 3 -- entirely in the clk domain (redrawn; replaces the SCLK-domain + toggle-sync design)</text>
  <rect x="80" y="180" width="4840" height="2740" rx="12" fill="#F5F5F5" stroke="#444" stroke-width="2"/>

  <rect x="240" y="470" width="1160" height="480" rx="10" fill="#212121" stroke="#212121" stroke-width="2"/>
  <text x="300" y="550" font-family="Arial" font-size="28" font-weight="700" fill="#fff">Top interface pins</text>
  <text x="300" y="595" font-family="Arial" font-size="18" fill="#fff">sclk_i, cs_n_i, mosi_i -- raw, async</text>
  <text x="300" y="627" font-family="Arial" font-size="18" fill="#fff">clk, rst_n -- the ONLY clock domain</text>
  <text x="300" y="659" font-family="Arial" font-size="18" fill="#fff">rx_data_o, rx_valid_o, miso_o, miso_oe_o</text>
  <text x="300" y="691" font-family="Arial" font-size="18" fill="#fff">tx_data_i reload source</text>
  <text x="300" y="730" font-family="Arial" font-size="15" fill="#BDBDBD">grep -rn "always_ff @(" rtl/ finds zero</text>
  <text x="300" y="750" font-family="Arial" font-size="15" fill="#BDBDBD">matches outside posedge clk anywhere.</text>

  <rect x="1600" y="430" width="1480" height="640" rx="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="1660" y="500" font-family="Arial" font-size="26" font-weight="700" fill="#212121">2FF oversampling</text>
  <text x="1660" y="545" font-family="Arial" font-size="18" fill="#212121">sclk_i, cs_n_i, mosi_i each pass</text>
  <text x="1660" y="577" font-family="Arial" font-size="18" fill="#212121">through a 2-flop synchronizer,</text>
  <text x="1660" y="609" font-family="Arial" font-size="18" fill="#212121">clocked entirely by clk</text>
  <text x="1660" y="655" font-family="Arial" font-size="16" fill="#0D47A1">Host requirement: max SCLK = f_clk/16</text>
  <text x="1660" y="680" font-family="Arial" font-size="16" fill="#0D47A1">(load-bearing -- synchronizers need</text>
  <text x="1660" y="705" font-family="Arial" font-size="16" fill="#0D47A1">this much margin to resolve edges)</text>

  <rect x="3250" y="430" width="1480" height="640" rx="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <text x="3310" y="500" font-family="Arial" font-size="26" font-weight="700" fill="#212121">Edge-detected shift/frame logic</text>
  <text x="3310" y="545" font-family="Arial" font-size="18" fill="#212121">bit/byte events are detected EDGES</text>
  <text x="3310" y="577" font-family="Arial" font-size="18" fill="#212121">on the synchronized signals, not real</text>
  <text x="3310" y="609" font-family="Arial" font-size="18" fill="#212121">clock edges -- no second domain to cross</text>
  <text x="3310" y="655" font-family="Arial" font-size="16" fill="#0D47A1">rx_valid_o pulses the SAME clk cycle</text>
  <text x="3310" y="680" font-family="Arial" font-size="16" fill="#0D47A1">the 8th bit is captured -- no CDC left</text>
  <text x="3310" y="705" font-family="Arial" font-size="16" fill="#0D47A1">to cross for it at all</text>

  <rect x="1600" y="1170" width="3130" height="480" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
  <text x="1660" y="1245" font-family="Arial" font-size="26" font-weight="700" fill="#212121">TX timing (the subtle part, still inside the clk domain)</text>
  <text x="1660" y="1290" font-family="Arial" font-size="18" fill="#212121">Bit 7 of each byte is driven COMBINATIONALLY from tx_data_i, which has had the whole</text>
  <text x="1660" y="1322" font-family="Arial" font-size="18" fill="#212121">inter-byte gap to settle; only the remaining 7 bits come from the shift register, loaded</text>
  <text x="1660" y="1354" font-family="Arial" font-size="18" fill="#212121">on the first DETECTED falling edge of the byte. This is what stops a fast host from ever</text>
  <text x="1660" y="1386" font-family="Arial" font-size="18" fill="#212121">shifting out the prior transaction's byte.</text>
  <text x="1660" y="1425" font-family="Arial" font-size="17" fill="#1B5E20">miso_oe_o: high only while the SYNCHRONIZED cs_n is selected -- combinational, same cycle.</text>

  <rect x="1600" y="1720" width="3130" height="330" rx="10" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/>
  <text x="1660" y="1795" font-family="Arial" font-size="26" font-weight="700" fill="#212121">Outputs</text>
  <text x="1660" y="1838" font-family="Arial" font-size="19" fill="#212121">rx_data_o[7:0], rx_valid_o (one pulse per completed byte, in clk domain, no CDC)</text>
  <text x="1660" y="1875" font-family="Arial" font-size="19" fill="#212121">miso_o, miso_oe_o</text>

  <path d="M1400,590 L1600,590" stroke="#64B5F6" stroke-width="1.5" fill="none" marker-end="url(#p2)"/>
  <text x="1430" y="566" font-family="Arial" font-size="17" fill="#212121">sclk_i/cs_n_i/mosi_i</text>
  <path d="M1400,680 L3000,680" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="8 6" fill="none" marker-end="url(#p3)"/>
  <text x="1430" y="705" font-family="Arial" font-size="17" fill="#212121">tx_data_i</text>

  <path d="M3080,600 L3250,600" stroke="#64B5F6" stroke-width="1.5" fill="none" marker-end="url(#p2)"/>
  <text x="3110" y="576" font-family="Arial" font-size="17" fill="#212121">synchronized signals</text>

  <path d="M2340,1070 L2340,1170" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#p1)"/>
  <text x="2000" y="1140" font-family="Arial" font-size="17" fill="#212121">shift register state</text>
  <path d="M3990,1070 L3990,1720" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#p1)"/>
  <text x="4020" y="1400" font-family="Arial" font-size="17" fill="#212121">rx_data_o / rx_valid_o</text>

  <rect x="240" y="2130" width="4490" height="720" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="2"/>
  <text x="300" y="2200" font-family="Arial" font-size="26" font-weight="700" fill="#212121">What changed from the pre-Phase-3 design</text>
  <text x="300" y="2245" font-family="Arial" font-size="19" fill="#212121">RX used to run on posedge sclk_i and TX on negedge sclk_i -- a real second clock domain inside this module --</text>
  <text x="300" y="2277" font-family="Arial" font-size="19" fill="#212121">with rx_valid_o crossing back into clk through a toggle synchronizer. Both are gone. Removing the toggle</text>
  <text x="300" y="2309" font-family="Arial" font-size="19" fill="#212121">synchronizer deleted the entire class of "byte arrives a few cycles later than you'd think" bugs that</text>
  <text x="300" y="2341" font-family="Arial" font-size="19" fill="#212121">motivated the original TX bit-7 workaround -- the workaround stays, it just no longer dodges a CDC race.</text>
  <text x="300" y="2385" font-family="Arial" font-size="19" fill="#212121">cs_n rising resets ONLY this module's own bit counter and TX state -- never anything outside it (this module</text>
  <text x="300" y="2417" font-family="Arial" font-size="19" fill="#212121">has no access to measurement state in the first place). Mid-byte deselect + reselect starts a clean new byte.</text>

  <line x1="300" y1="2790" x2="480" y2="2790" stroke="#1565C0" stroke-width="2" marker-end="url(#p1)"/>
  <text x="520" y="2798" font-family="Arial" font-size="18" fill="#212121">WIRE.DATA</text>
  <line x1="1250" y1="2790" x2="1430" y2="2790" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#p2)"/>
  <text x="1470" y="2798" font-family="Arial" font-size="18" fill="#212121">WIRE.RAW/SYNCHRONIZED PINS</text>
  <line x1="2500" y1="2790" x2="2680" y2="2790" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="8 6" marker-end="url(#p3)"/>
  <text x="2720" y="2798" font-family="Arial" font-size="18" fill="#212121">WIRE.CFG</text>
</svg>
